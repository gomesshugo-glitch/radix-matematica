        (done && o.total ? '<span class="ok">' + o.hits + '/' + o.total + ' acertos</span>' : (done ? '<span class="ok">Concluída</span>' : '')) +
        extras.join('') + '</div></div>' +
      (!done ? '<div class="atv-acts"><button type="button" class="btn btn-sec btn-sm" onclick="app.demoAbrir(\'' + it.temaId + '\')">Abrir atividade</button>' + sel + '</div>' : '') +
      '</article>';
  },
  htmlAgenda(sem, dose, atualN) {
    const hoje = this.hoje(), self = this;
    const idxHoje = Math.floor((hoje - dt(sem.ini)) / 86400000);
    const nDias = sem.dias || 7;
    const ehAtual = sem.n === atualN, passada = this._semanaPassada(sem);
    const grupos = { late: [], hoje: [], prox: [], feitas: [] };
    dose.itens.forEach(it => {
      const d = self.diaDe(it);
      if (self.feito(it.key)) grupos.feitas.push(it);
      else if (passada || (ehAtual && d < idxHoje)) grupos.late.push(it);
      else if (ehAtual && d === idxHoje) grupos.hoje.push(it);
      else grupos.prox.push(it);
    });
    const ordena = a => a.sort((x, y) => self.diaDe(x) - self.diaDe(y) || y.peso - x.peso);
    let html = '<div class="sec-title"><span class="ic">' + ic('cal', 18) + '</span>Agenda da semana' +
      '<span class="lado">' + (dose.congelado
        ? '<span class="meta">plano fixado em ' + fmtCurto(new Date(dose.criadoEm)) + '</span><button type="button" class="btn btn-ghost btn-sm" onclick="app.recalcularSemana(' + sem.n + ')">' + ic('refresh', 14) + ' Recalcular</button>'
        : '<span class="meta tip" data-tip="A semana fica fixada na primeira atividade concluída. Até lá, mudanças de perfil recalculam tudo." tabindex="0">plano ainda flexível</span>') + '</span></div>';
    if (grupos.late.length) {
      html += '<div class="grupo"><div class="grupo-h atraso">' + ic('alert', 14) + ' Atrasadas <span class="n">' + grupos.late.length + '</span></div>' +
        ordena(grupos.late).map(it => self._cardAtividade(sem, dose, it, 'late')).join('') + '</div>';
    }
    if (ehAtual) {
      const diaEstudo = dose.diasAtivos.indexOf(idxHoje) !== -1;
      html += '<div class="grupo"><div class="grupo-h hoje">Hoje · ' + DIAS_LONGOS[idxHoje] + ' ' + fmtCurto(hoje) + (grupos.hoje.length ? ' <span class="n">' + grupos.hoje.length + '</span>' : '') + '</div>' +
        (grupos.hoje.length ? ordena(grupos.hoje).map(it => self._cardAtividade(sem, dose, it, 'hoje')).join('')
          : '<div class="vazio">' + (diaEstudo ? '<b>Nada pendente para hoje.</b> Adiante uma das próximas ou descanse: constância também é recuperação.' : '<b>Hoje não é dia de estudo no seu plano.</b> Se sobrar tempo, adiante uma das próximas atividades.') + '</div>') + '</div>';
    }
    if (grupos.prox.length) {
      html += '<div class="grupo"><div class="grupo-h">' + (ehAtual ? 'Próximas' : 'Atividades da semana') + ' <span class="n">' + grupos.prox.length + '</span></div>';
      const porDia = {};
      grupos.prox.forEach(it => { const d = self.diaDe(it); (porDia[d] = porDia[d] || []).push(it); });
      Object.keys(porDia).map(Number).sort((a, b) => a - b).forEach(d => {
        html += '<div class="dia-lbl">' + DIAS_LONGOS[d] + ' · ' + fmtCurto(addDias(dt(sem.ini), d)) + '</div>' +
          porDia[d].sort((a, b) => b.peso - a.peso).map(it => self._cardAtividade(sem, dose, it, 'prox')).join('');
      });
      html += '</div>';
    }
    if (!dose.itens.length) html += '<div class="vazio"><b>Nenhuma atividade individual nesta semana.</b> Seu tempo cobre só o mini-simulado. Amplie a disponibilidade no perfil para receber questões.</div>';
    if (dose.fora.length) {
      html += '<div class="grupo"><div class="grupo-h">Fora do tempo desta semana</div>' +
        dose.fora.map(f => '<div class="fora"><b>' + esc(f.nome) + '</b>: ' + esc(f.motivo) + '</div>').join('') + '</div>';
    }
    if (dose.temMini) {
      const mini = this.minis[sem.n];
      const sab = addDias(dt(sem.ini), nDias >= 7 ? 5 : nDias - 1);
      html += '<div class="mini"><span class="ic">' + ic('clock', 22) + '</span>' +
        '<div class="inf"><div class="t">Mini-simulado da semana</div><div class="s">' + CONFIG.MINI_QTDE + ' questões, ' + CONFIG.MINI_POR_TEMA + ' por assunto · ~' + CONFIG.MIN_MINI + ' min · sugerido para ' + DIAS_LONGOS[nDias >= 7 ? 5 : nDias - 1].toLowerCase() + ' ' + fmtCurto(sab) + '</div></div>' +
        '<div class="act">' + (mini
          ? '<div class="mini-res"><b>' + mini.total + '/' + CONFIG.MINI_QTDE + '</b><button type="button" class="btn btn-ghost btn-sm" data-foco="mini:' + sem.n + '" onclick="app.modalMini(' + sem.n + ')">Ver ou editar</button></div>'
          : '<button type="button" class="btn btn-sec btn-sm" data-foco="mini:' + sem.n + '" onclick="app.modalMini(' + sem.n + ')">Registrar resultado</button>') + '</div></div>';
    }
    if (grupos.feitas.length) {
      html += '<details class="concl"><summary><span class="chev">' + ic('chev', 14) + '</span>Concluídas <span class="n n-ok">' + grupos.feitas.length + '</span></summary>' +
        grupos.feitas.map(it => self._cardAtividade(sem, dose, it, 'done')).join('') + '</details>';
    }
    return html;
  },

  /* ============================================================
     MAIS — abas: Evolução · 7 semanas · Perfil
     ============================================================ */
  htmlMais(atualN, selN) {
    const tab = this._uiTab;
    const abas = [['evo', 'Evolução'], ['semanas', '7 semanas'], ['perfil', 'Perfil']];
    return '<div class="tabs" role="tablist" aria-label="Mais informações">' + abas.map(a =>
        '<button type="button" role="tab" id="tab-' + a[0] + '" data-tabbtn="' + a[0] + '" aria-selected="' + (tab === a[0]) + '" aria-controls="panel-' + a[0] + '" tabindex="' + (tab === a[0] ? 0 : -1) + '" onclick="app.setTab(\'' + a[0] + '\')" onkeydown="app._tabTeclas(event)">' + a[1] + '</button>').join('') + '</div>' +
      '<div id="panel-evo" role="tabpanel" aria-labelledby="tab-evo" data-tabpanel="evo" class="tabpanel"' + (tab !== 'evo' ? ' hidden' : '') + '><div class="card" id="sec-evo">' + this.htmlEvolucao(atualN) + '</div></div>' +
      '<div id="panel-semanas" role="tabpanel" aria-labelledby="tab-semanas" data-tabpanel="semanas" class="tabpanel"' + (tab !== 'semanas' ? ' hidden' : '') + '><div class="card" id="sec-semanas">' + this.htmlTimeline(atualN, selN) + '</div></div>' +
      '<div id="panel-perfil" role="tabpanel" aria-labelledby="tab-perfil" data-tabpanel="perfil" class="tabpanel"' + (tab !== 'perfil' ? ' hidden' : '') + '><div class="card" id="sec-perfil">' + this.htmlPerfil() + '</div></div>';
  },
  _tabTeclas(e) {
    if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
    const ordem = ['evo', 'semanas', 'perfil'];
    let i = ordem.indexOf(this._uiTab) + (e.key === 'ArrowRight' ? 1 : -1);
    i = (i + ordem.length) % ordem.length;
    this.setTab(ordem[i]);
    const b = document.getElementById('tab-' + ordem[i]); if (b) b.focus();
    e.preventDefault();
  },
  selecionarSemana(n) { this.semanaSel = n; this.render({ scrollPara: 'sec-next' }); this.anunciar('Semana ' + n + ' selecionada.'); },
  evoSelecionar(n) { this._evoSel = n; this.render({ foco: 'evo:' + n }); },
  _estadoSemana(s, atualN) {
    const dose = this.dosePara(s);
    const n = this._numerosSemana(s, dose);
    const passada = this._semanaPassada(s);
    const futura = this.hoje() < dt(s.ini);
    let st = 'futura';
    if (n.pct >= 100) st = 'done'; else if (s.n === atualN) st = 'atual'; else if (passada) st = 'incompleta';
    return { dose, n, st, passada, futura };
  },
  htmlEvolucao(atualN) {
    const metaMini = Math.round(this.perfil.meta / 3);
    const regs = SEMANAS.map(s => this.minis[s.n] ? this.minis[s.n].total : null);
    const feitosN = SEMANAS.map(s => s.n).filter(n => this.minis[n]);
    const titulo = '<div class="sec-title"><span class="ic">' + ic('chart', 18) + '</span>Evolução até a prova</div>';
    if (!feitosN.length) {
      return titulo + '<div class="vazio"><b>Seus mini-simulados vão aparecer aqui.</b> Cada semana fecha com um mini de ' + CONFIG.MINI_QTDE + ' questões; a meta é ' + metaMini + ' acertos por mini (proporcional à sua meta de ' + this.perfil.meta + '/45).</div>';
    }
    const selN = (this._evoSel && this.minis[this._evoSel]) ? this._evoSel : feitosN[feitosN.length - 1];
    const metaPct = Math.min(100, metaMini / CONFIG.MINI_QTDE * 100);
    const descr = SEMANAS.map((s, i) => regs[i] != null ? 'Semana ' + s.n + ': ' + regs[i] + ' de ' + CONFIG.MINI_QTDE + '. ' : '').join('');
    const barras = SEMANAS.map((s, i) => {
      const v = regs[i];
      const futura = this.hoje() < dt(s.ini);
      const atual = s.n === atualN && v == null;
      const cls = v != null ? '' : (atual ? ' atual' : ' off');
      const alt = 'Semana ' + s.n + (v != null ? ': ' + v + ' de ' + CONFIG.MINI_QTDE : atual ? ': em curso, mini ainda não registrado' : futura ? ': futura' : ': sem registro');
      return '<button type="button" class="evo-col" data-foco="evo:' + s.n + '" aria-label="' + alt + '" aria-pressed="' + (s.n === selN) + '"' + (v != null ? ' onclick="app.evoSelecionar(' + s.n + ')"' : ' disabled') + '>' +
        '<span class="evo-v">' + (v != null ? v : (atual ? '…' : '')) + '</span>' +
        '<div class="evo-bar' + cls + (s.n === selN ? ' sel' : '') + '" style="height:' + (v != null ? Math.max(6, v / CONFIG.MINI_QTDE * 100) : (atual ? 30 : 18)) + '%"></div>' +
        '<span class="evo-l">S' + s.n + '</span></button>';
    }).join('');
    const grafico = '<div class="evo" role="group" aria-label="Acertos por mini-simulado. ' + descr + 'Meta: ' + metaMini + ' de ' + CONFIG.MINI_QTDE + '. Toque em uma semana para ver o diagnóstico.">' +
      '<div class="meta-line" style="bottom:' + metaPct + '%"><small>meta ' + metaMini + '</small></div>' + barras + '</div>' +
      '<div class="legenda"><span><i style="background:var(--blue)"></i>registrado</span><span><i style="background:var(--coral)"></i>semana atual</span><span><i style="border:1px dashed var(--line-2)"></i>futura ou sem registro</span><span><i style="border-top:2px dashed var(--green);height:0;border-radius:0"></i>meta por mini</span></div>' +
      '<table class="sr-only"><caption>Acertos por mini-simulado</caption><tbody><tr>' + SEMANAS.map(s => '<th scope="col">Semana ' + s.n + '</th>').join('') + '</tr><tr>' + regs.map(v => '<td>' + (v == null ? 'sem registro' : v + ' de ' + CONFIG.MINI_QTDE) + '</td>').join('') + '</tr></tbody></table>';
    // diagnóstico da semana selecionada
    const m = this.minis[selN];
    const pares = Object.keys(m.porTema).map(id => [id, m.porTema[id]]);
    const melhor = pares.slice().sort((a, b) => b[1] - a[1])[0], pior = pares.slice().sort((a, b) => a[1] - b[1])[0];
    const pct = Math.round(m.total / CONFIG.MINI_QTDE * 100), delta = m.total - metaMini;
    const antN = feitosN.filter(n => n < selN).pop();
    const deltaAnt = antN ? m.total - this.minis[antN].total : null;
    const reaparece = SEMANAS.find(s => s.n > selN && (s.temas.indexOf(pior[0]) !== -1 || s.geo.id === pior[0]));
    const rec = pior[1] >= 3 ? 'Desempenho sólido em todos os assuntos. Mantenha o ritmo na próxima semana.'
      : reaparece ? 'Reforce ' + T(pior[0]).nome + ': ele volta na Semana ' + reaparece.n + ', e o plano aumenta a carga se o desempenho continuar baixo.'
      : 'Reserve uns 30 minutos extras para ' + T(pior[0]).nome + ' na próxima semana: ele não volta no roteiro fixo.';
    const diag = '<div class="diag"><div class="h3">Diagnóstico · mini da Semana ' + selN + '</div>' +
      '<div class="stats">' +
      '<div class="stat"><div class="v">' + m.total + '/' + CONFIG.MINI_QTDE + '</div><div class="l">' + pct + '% DE ACERTOS</div></div>' +
      '<div class="stat ' + (delta >= 0 ? 'pos' : 'warn') + '"><div class="v">' + (delta >= 0 ? '+' : '') + delta + '</div><div class="l">VS. META (' + metaMini + ')</div></div>' +
      (deltaAnt != null ? '<div class="stat ' + (deltaAnt > 0 ? 'pos' : deltaAnt < 0 ? 'neg' : '') + '"><div class="v">' + (deltaAnt > 0 ? '+' : '') + deltaAnt + '</div><div class="l">VS. SEMANA ' + antN + '</div></div>' : '<div class="stat"><div class="v">1º</div><div class="l">PRIMEIRO MINI</div></div>') +
      '<div class="stat pos"><div class="v">' + esc(T(melhor[0]).nome) + '</div><div class="l">MELHOR · ' + melhor[1] + '/' + CONFIG.MINI_POR_TEMA + '</div></div>' +
      '<div class="stat neg"><div class="v">' + esc(T(pior[0]).nome) + '</div><div class="l">ATENÇÃO · ' + pior[1] + '/' + CONFIG.MINI_POR_TEMA + '</div></div></div>' +
      '<p class="rec">' + rec + '</p>' +
      '<div class="mt-10"><button type="button" class="btn btn-ghost btn-sm" onclick="app.modalMini(' + selN + ')">Ver ou editar lançamento</button></div></div>';
    return titulo + grafico + diag;
  },
  htmlTimeline(atualN, selN) {
    const self = this;
    const btns = SEMANAS.map(s => {
      const e = self._estadoSemana(s, atualN);
      const rot = e.st === 'done' ? 'Concluída' : e.st === 'atual' ? 'Atual' : e.st === 'incompleta' ? e.n.pct + '% feita' : 'Futura';
      return '<button type="button" class="tl-item ' + e.st + (s.n === selN ? ' sel' : '') + '" aria-pressed="' + (s.n === selN) + '"' + (s.n === atualN ? ' aria-current="date"' : '') +
        ' aria-label="Semana ' + s.n + ', ' + rotSemana(s) + ', ' + rot.toLowerCase() + (s.n === selN ? ', selecionada' : '') + '" onclick="app.selecionarSemana(' + s.n + ')">' +
        '<span class="n">Semana ' + s.n + '<span class="st">' + rot + '</span></span><span class="d">' + rotSemana(s) + '</span>' +
        '<span class="bar"><i style="width:' + e.n.pct + '%"></i></span></button>';
    }).join('');
    return '<div class="sec-title"><span class="ic">' + ic('flag', 18) + '</span>As 7 semanas</div>' +
      '<div class="tl" role="group" aria-label="Escolher a semana exibida na agenda">' + btns +
      '<div class="tl-prova">Provas<small>' + fmtCurto(dt(CONFIG.PROVA1)) + ' e ' + fmtCurto(dt(CONFIG.PROVA2)) + '</small></div></div>' +
      '<p class="sub">A Semana 7 acontece entre os dois domingos de prova: os assuntos de maior incidência ficam para o fim, frescos na memória. Toque em uma semana para ver a agenda dela.</p>';
  },
  htmlTimelineMini(atualN, selN) {
    const self = this;
    const dias = Math.ceil((dt(CONFIG.PROVA2) - this.hoje()) / 86400000);
    const semSel = SEMANAS.find(s => s.n === selN);
    return '<div class="sec-title mb-8"><span class="ic">' + ic('flag', 18) + '</span>As 7 semanas</div>' +
      '<div class="tl-mini" role="group" aria-label="Escolher semana">' + SEMANAS.map(s => {
        const e = self._estadoSemana(s, atualN);
        return '<button type="button" class="' + e.st + (s.n === selN ? ' sel' : '') + '" aria-pressed="' + (s.n === selN) + '" aria-label="Semana ' + s.n + ', ' + (e.st === 'done' ? 'concluída' : e.st === 'atual' ? 'atual' : e.st === 'incompleta' ? e.n.pct + ' por cento feita' : 'futura') + '" onclick="app.selecionarSemana(' + s.n + ')">' + s.n + '</button>';
      }).join('') + '</div>' +
      '<p class="sub mt-10">Vendo a <b class="txt-2">Semana ' + selN + '</b> · ' + rotSemana(semSel) + (selN !== atualN && atualN ? ' · <button type="button" class="btn btn-ghost btn-sm btn-inline" onclick="app.semanaSel=null;app.render({scrollPara:\'sec-next\'})">voltar à atual</button>' : '') + '</p>' +
      '<div class="divider"></div>' +
      '<div class="kpis kpis-2"><div class="kpi"><div class="v c-coral">' + (dias > 0 ? dias : 0) + '</div><div class="l">dias para Matemática</div></div>' +
      '<div class="kpi"><div class="v">' + fmtCurto(dt(CONFIG.PROVA1)) + ' e ' + fmtCurto(dt(CONFIG.PROVA2)) + '</div><div class="l">provas</div></div></div>';
  },
  _faixasTxt() { return ['menos de 10', '10–15', '15–20', '20–25', '25–30', '30–35', '35–40', 'acima de 40']; },
  htmlPerfil() {
    const p = this.perfil;
    return '<div class="sec-title"><span class="ic">' + ic('user', 18) + '</span>Seu perfil de estudo</div>' +
      '<div class="stats" style="margin-top:0">' +
      '<div class="stat"><div class="v">' + this._faixasTxt()[p.acertos] + '</div><div class="l">PONTO DE PARTIDA</div></div>' +
      '<div class="stat"><div class="v">' + p.meta + '/45</div><div class="l">META</div></div>' +
      '<div class="stat"><div class="v">' + (p.horasDia * p.dias.length).toFixed(1).replace('.', ',') + 'h</div><div class="l">POR SEMANA</div></div>' +
      '<div class="stat"><div class="v v-dias">' + p.dias.map(i => DIAS_SEMANA[i]).join(' · ') + '</div><div class="l">DIAS DE ESTUDO</div></div></div>' +
      '<p class="sub my-a">Mudou a rotina ou evoluiu mais rápido? Reajuste: as semanas futuras recalculam na hora; semanas já iniciadas mantêm o plano fixado.</p>' +
      '<button type="button" class="btn btn-sec" onclick="app._editando=true;app._qTemp=null;app.qStep=0;app.render({modo:\'tela\'})">' + ic('edit', 15) + ' Reajustar meu perfil</button>';
  },
  htmlPerfilCompacto() {
    const p = this.perfil;
    return '<div class="sec-title mb-8"><span class="ic">' + ic('user', 18) + '</span>Perfil</div>' +
      '<div class="kpis kpis-2"><div class="kpi"><div class="v">' + p.meta + '/45</div><div class="l">meta</div></div>' +
      '<div class="kpi"><div class="v">' + (p.horasDia * p.dias.length).toFixed(1).replace('.', ',') + 'h</div><div class="l">por semana</div></div></div>' +
      '<p class="meta my-b">' + p.dias.map(i => DIAS_LONGOS[i]).join(', ') + '</p>' +
      '<button type="button" class="btn btn-sec btn-sm btn-block" onclick="app._editando=true;app._qTemp=null;app.qStep=0;app.render({modo:\'tela\'})">' + ic('edit', 14) + ' Reajustar perfil</button>';
  },

  /* ---------------- PÓS-PROVA ---------------- */
  htmlPosProva() {
    let minF = 0, minT = 0, atvF = 0, atvT = 0, minisFeitos = 0;
    const self = this;
    SEMANAS.forEach(s => {
      const d = self.dosePara(s);
      minT += d.totalMin;
      d.itens.forEach(it => { atvT++; if (self.feito(it.key)) { atvF++; minF += it.min; } });
      if (d.temMini) { atvT++; if (self.minis[s.n]) { atvF++; minF += CONFIG.MIN_MINI; minisFeitos++; } }
    });
    const comAmostra = TEMAS.map(t => ({ t, a: self.amostraTema(t.id) })).filter(x => x.a.total >= 4);
    comAmostra.sort((x, y) => (y.a.hits / y.a.total) - (x.a.hits / x.a.total));
    const melhor = comAmostra[0], pior = comAmostra[comAmostra.length - 1];
    const selN = this.semanaSel || 7;
    const sem = SEMANAS.find(s => s.n === selN);
    return '<svg width="0" height="0" aria-hidden="true" class="svg-defs"><defs><linearGradient id="gradp"><stop offset="0%" stop-color="#22d3ee"/><stop offset="100%" stop-color="#3b82f6"/></linearGradient></defs></svg>' +
      '<div class="greet"><div><div class="h1">Você chegou ao fim, ' + esc(this.primeiroNome()) + '</div>' +
      '<p class="sub">As provas foram em ' + fmtCurto(dt(CONFIG.PROVA1)) + ' e ' + fmtCurto(dt(CONFIG.PROVA2)) + '. A revisão cumpriu o papel dela. Agora é esperar o resultado com a consciência tranquila de quem trabalhou.</p></div></div>' +
      '<div class="layout"><div class="col-main stack-v">' +
      '<section id="sec-next" aria-label="Resumo da revisão"><div class="next done"><span class="eyebrow">Resumo da sua revisão</span><h2>7 semanas em números</h2>' +
      '<div class="stats">' +
      '<div class="stat"><div class="v">' + this._hm(minF) + '</div><div class="l">TEMPO ESTUDADO · de ' + this._hm(minT) + '</div></div>' +
      '<div class="stat"><div class="v">' + atvF + '/' + atvT + '</div><div class="l">ATIVIDADES</div></div>' +
      '<div class="stat"><div class="v">' + minisFeitos + '/7</div><div class="l">MINI-SIMULADOS</div></div>' +
      (melhor && pior && melhor !== pior ? '<div class="stat pos"><div class="v">' + esc(melhor.t.nome) + '</div><div class="l">MELHOR · ' + Math.round(melhor.a.hits / melhor.a.total * 100) + '%</div></div>' +
        '<div class="stat neg"><div class="v">' + esc(pior.t.nome) + '</div><div class="l">MAIOR DESAFIO · ' + Math.round(pior.a.hits / pior.a.total * 100) + '%</div></div>' : '') +
      '</div></div></section>' +
      '<section id="sec-agenda" aria-label="Revisitar semanas"><div class="card">' + this.htmlTimeline(null, selN) + '</div>' +
      '<div class="mt-20">' + this.htmlAgenda(sem, this.dosePara(sem), null) + '</div></section>' +
      '<section id="sec-mais" aria-label="Evolução e perfil"><div class="tabs" role="tablist"><button type="button" role="tab" id="tab-evo" data-tabbtn="evo" aria-selected="' + (this._uiTab !== 'perfil') + '" aria-controls="panel-evo" onclick="app.setTab(\'evo\')">Evolução</button><button type="button" role="tab" id="tab-perfil" data-tabbtn="perfil" aria-selected="' + (this._uiTab === 'perfil') + '" aria-controls="panel-perfil" onclick="app.setTab(\'perfil\')">Perfil</button></div>' +
      '<div id="panel-evo" role="tabpanel" data-tabpanel="evo" class="tabpanel"' + (this._uiTab === 'perfil' ? ' hidden' : '') + '><div class="card" id="sec-evo">' + this.htmlEvolucao(null) + '</div></div>' +
      '<div id="panel-perfil" role="tabpanel" data-tabpanel="perfil" class="tabpanel"' + (this._uiTab !== 'perfil' ? ' hidden' : '') + '><div class="card" id="sec-perfil">' + this.htmlPerfil() + '</div></div></section>' +
      '<footer>Mockup · Radix Matemática · dados salvos apenas neste navegador</footer>' +
      '</div><aside class="col-side" aria-label="Painel"><div class="stack"><div class="card">' + this.htmlTimelineMini(null, selN) + '</div><div class="card">' + this.htmlPerfilCompacto() + '</div></div></aside></div>';
  }
};

document.querySelectorAll('.bnav [data-ic]').forEach(el => { el.innerHTML = ic(el.getAttribute('data-ic'), 20); });
app.carregar();
app.render({ modo: 'tela' });
</script>
</body>
</html>
