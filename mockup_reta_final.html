<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MOCKUP · Revisão Final ENEM 2026 — Radix Matemática</title>
<style>
  :root {
    --bg: #0e1a36;
    --bg-2: #16244a;
    --surface: #1a2b52;
    --surface-2: #223464;
    --line: #2e4275;
    --line-2: #3a5089;
    --text: #eef2fb;
    --text-2: #c6d2ec;
    --muted: #8fa3cc;
    --cyan: #22d3ee;
    --cyan-press: #0fb8d4;
    --coral: #ff7a5c;
    --red: #f87171;
    --green: #34d399;
    --amber: #fbbf24;
    --grad: linear-gradient(135deg, #22d3ee, #3b82f6);
    --r: 14px;
    --shadow: 0 10px 30px -18px rgba(0,0,0,.6);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    font-family: 'Inter', -apple-system, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg); color: var(--text);
    min-height: 100vh; padding-bottom: 90px;
    -webkit-font-smoothing: antialiased;
  }
  body.modal-aberto { overflow: hidden; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 0 16px; }

  .h-page { font-size: 21px; font-weight: 800; letter-spacing: -.01em; }
  .h-sec  { font-size: 15px; font-weight: 800; margin-bottom: 12px; display:flex; align-items:center; gap:8px; }
  .h-sec .ic { color: var(--cyan); display:inline-flex; }
  .h-sec .lado { margin-left:auto; display:inline-flex; align-items:center; gap:8px; font-weight:500; }
  .txt-sub { font-size: 13px; color: var(--muted); line-height: 1.5; }
  .txt-mini { font-size: 11.5px; color: var(--muted); }

  :focus { outline: none; }
  :focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; border-radius: 6px; }
  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }
  button { font-family: inherit; cursor: pointer; }
  button:disabled { opacity: .45; cursor: not-allowed; }

  /* ---------- barra demo ---------- */
  .demo {
    background: #241c47; border-bottom: 1px solid #4c3d8f;
    padding: 8px 16px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    font-size: 12px; color: #b9aef0;
  }
  .demo b { letter-spacing: .08em; }
  .demo select, .demo button {
    background: var(--surface); color: var(--text-2);
    border: 1px solid var(--line-2); border-radius: 7px;
    padding: 6px 10px; font-size: 12px; min-height: 32px;
  }
  .demo button:hover { border-color: var(--coral); color: var(--coral); }

  /* ---------- header ---------- */
  .top {
    position: sticky; top: 0; z-index: 40;
    background: rgba(14,26,54,.92); backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line);
  }
  .top-in {
    max-width: 760px; margin: 0 auto; padding: 9px 16px;
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
  }
  .brand { display: flex; align-items: center; gap: 9px; font-size: 13.5px; font-weight: 800; }
  /* Marca: radical Radix em SVG (mesmo path do header do app) sobre o gradiente da casa */
  .logo {
    width: 30px; height: 30px; border-radius: 8px; background: var(--grad);
    display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .brand small { color: var(--cyan); font-weight: 700; }
  .count-pill {
    display: inline-flex; align-items: center; gap: 7px;
    background: var(--surface); border: 1px solid var(--line-2);
    border-radius: 999px; padding: 6px 13px; font-size: 12px; color: var(--text-2);
    white-space: nowrap;
  }
  .count-pill b { color: var(--coral); font-size: 14px; }

  section { margin-top: 26px; }
  .panel {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--r); padding: 18px;
  }

  /* ---------- próximo passo ---------- */
  .next {
    background: linear-gradient(160deg, rgba(34,211,238,.13), rgba(59,130,246,.05) 60%);
    border: 1px solid rgba(34,211,238,.35);
    border-radius: 16px; padding: 20px 18px; box-shadow: var(--shadow);
  }
  .next .tag-topo { font-size: 10.5px; font-weight: 800; letter-spacing: .12em; color: var(--cyan); }
  .next h2 { font-size: 19px; margin: 8px 0 3px; line-height: 1.3; }
  .next .infos { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12.5px; color: var(--text-2); margin: 8px 0 4px; }
  .next .infos span { display: inline-flex; align-items: center; gap: 5px; }
  .next .just {
    font-size: 12.5px; color: var(--muted); border-left: 3px solid var(--line-2);
    padding-left: 10px; margin: 10px 0 16px; line-height: 1.45;
  }
  .next .acts { display: flex; gap: 10px; flex-wrap: wrap; }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    border: none; border-radius: 10px; min-height: 44px;
    padding: 11px 20px; font-size: 14px; font-weight: 800;
    transition: transform .12s, box-shadow .12s, background .12s;
  }
  .btn-pri { background: var(--grad); color: #06121f; }
  .btn-pri:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 10px 24px -10px rgba(34,211,238,.55); }
  .btn-pri:active { transform: translateY(0); background: var(--cyan-press); }
  .btn-ghost { background: transparent; color: var(--text-2); border: 1px solid var(--line-2); }
  .btn-ghost:hover:not(:disabled) { border-color: var(--cyan); color: var(--cyan); }
  .btn-danger { background: transparent; color: var(--red); border: 1px solid rgba(248,113,113,.5); }
  .btn-danger:hover { border-color: var(--red); background: rgba(248,113,113,.08); }
  .btn-sm { min-height: 36px; padding: 7px 14px; font-size: 12.5px; border-radius: 8px; }

  /* ---------- progresso ---------- */
  .prog-big { display: flex; align-items: center; gap: 16px; }
  .prog-ring { flex-shrink: 0; position: relative; width: 72px; height: 72px; }
  .prog-ring svg { transform: rotate(-90deg); }
  .prog-ring .pct {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-size: 16px; font-weight: 800;
  }
  .prog-info { flex: 1; min-width: 0; }
  .prog-info .lin { font-size: 13.5px; font-weight: 700; }
  .prog-info .det { font-size: 12px; color: var(--muted); margin-top: 3px; }

  /* ---------- agenda ---------- */
  .dia-grupo { margin-top: 16px; }
  .dia-head {
    display: flex; align-items: baseline; gap: 8px; margin-bottom: 8px;
    font-size: 12px; font-weight: 800; letter-spacing: .07em; color: var(--muted);
  }
  .dia-head.hoje { color: var(--cyan); }
  .dia-head .data { font-weight: 500; letter-spacing: 0; }
  .atv {
    display: flex; align-items: center; gap: 12px;
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 12px; padding: 12px 14px; margin-bottom: 8px;
  }
  .atv.done { opacity: .62; }
  .atv.done .t { text-decoration: line-through; }
  .atv .chk {
    width: 26px; height: 26px; border-radius: 8px; flex-shrink: 0;
    border: 2px solid var(--line-2); background: transparent;
    display: inline-flex; align-items: center; justify-content: center;
    color: transparent; transition: all .12s; padding: 0;
  }
  .atv .chk[aria-checked="true"] { background: var(--green); border-color: var(--green); color: #06121f; }
  .atv .chk:hover { border-color: var(--green); }
  .atv .body { flex: 1; min-width: 0; }
  .atv .t { font-size: 13.5px; font-weight: 700; line-height: 1.35; }
  .atv .m { font-size: 11.5px; color: var(--muted); margin-top: 3px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .pri {
    font-size: 9.5px; font-weight: 800; letter-spacing: .06em;
    padding: 2px 7px; border-radius: 5px; white-space: nowrap;
  }
  .pri-3 { background: rgba(248,113,113,.15); color: var(--red); }
  .pri-2 { background: rgba(251,191,36,.13); color: var(--amber); }
  .pri-1 { background: rgba(52,211,153,.14); color: var(--green); }
  .pri-g { background: rgba(167,139,250,.16); color: #b9aef0; }
  .pri-auto { background: rgba(34,211,238,.13); color: var(--cyan); cursor: help; }
  .atv .mover {
    background: var(--bg-2); color: var(--muted); border: 1px solid var(--line);
    border-radius: 7px; font-size: 11px; padding: 6px 6px; min-height: 32px; max-width: 74px;
  }
  .atv-vazia {
    border: 1px dashed var(--line-2); border-radius: 12px; padding: 16px;
    text-align: center; font-size: 12.5px; color: var(--muted);
  }
  .fora-item {
    border: 1px dashed var(--line-2); border-radius: 12px; padding: 12px 14px;
    font-size: 12.5px; color: var(--muted); margin-bottom: 8px; line-height: 1.5;
  }
  .fora-item b { color: var(--text-2); }
  details.concl { margin-top: 16px; }
  details.concl summary {
    cursor: pointer; font-size: 12px; font-weight: 800; letter-spacing: .07em;
    color: var(--muted); list-style: none; display: flex; align-items: center; gap: 6px;
    min-height: 44px;
  }
  details.concl summary::-webkit-details-marker { display: none; }
  details.concl summary .chev { transition: transform .15s; display: inline-flex; }
  details.concl[open] summary .chev { transform: rotate(90deg); }

  /* ---------- mini ---------- */
  .mini {
    background: var(--surface-2); border: 1px solid var(--line-2);
    border-radius: 12px; padding: 14px; margin-top: 16px;
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  }
  .mini .ic { color: var(--cyan); display: inline-flex; }
  .mini .inf { flex: 1; min-width: 170px; }
  .mini .t { font-weight: 800; font-size: 13.5px; }
  .mini .s { font-size: 11.5px; color: var(--muted); margin-top: 2px; }
  .mini-res {
    display: inline-flex; align-items: center; gap: 10px;
    background: rgba(52,211,153,.10); border: 1px solid rgba(52,211,153,.35);
    border-radius: 10px; padding: 8px 12px;
  }
  .mini-res b { color: var(--green); font-size: 15px; }

  /* ---------- diagnóstico / stats ---------- */
  .diag { border-left: 3px solid var(--cyan); padding-left: 14px; margin-top: 16px; }
  .diag .linha, .stats-linha { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 8px; }
  .stat { background: var(--bg-2); border-radius: 9px; padding: 9px 13px; min-width: 90px; flex: 1; }
  .stat .v { font-size: 16px; font-weight: 800; }
  .stat .l { font-size: 10px; color: var(--muted); letter-spacing: .05em; margin-top: 1px; }
  .diag .rec { font-size: 12.5px; color: var(--text-2); margin-top: 10px; line-height: 1.5; }

  /* ---------- evolução ---------- */
  .evo { display: flex; align-items: flex-end; gap: 8px; height: 130px; margin-top: 26px; position: relative; }
  .evo .meta-line { position: absolute; left: 0; right: 0; border-top: 2px dashed rgba(52,211,153,.55); pointer-events: none; }
  .evo .meta-line small { position: absolute; right: 0; top: -16px; font-size: 10px; color: var(--green); font-weight: 700; }
  .evo-col { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 4px; height: 100%; }
  .evo-bar { width: 100%; max-width: 44px; border-radius: 6px 6px 0 0; background: var(--grad); min-height: 4px; }
  .evo-bar.off { background: var(--bg-2); border: 1px dashed var(--line-2); }
  .evo-v { font-size: 11px; font-weight: 800; color: var(--cyan); }
  .evo-l { font-size: 10px; color: var(--muted); }

  /* ---------- timeline ---------- */
  .tl { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 10px; scroll-snap-type: x proximity; }
  .tl::-webkit-scrollbar { height: 5px; }
  .tl::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 3px; }
  .tl-item {
    scroll-snap-align: start; min-width: 116px; text-align: left;
    background: var(--surface); border: 1.5px solid var(--line);
    border-radius: 11px; padding: 10px 11px; color: var(--text-2);
  }
  .tl-item:hover { border-color: var(--cyan); }
  .tl-item .n { font-size: 10.5px; font-weight: 800; letter-spacing: .05em; color: var(--muted); display:flex; justify-content: space-between; gap: 6px; }
  .tl-item .d { font-size: 10.5px; color: var(--muted); margin-top: 2px; }
  .tl-item .bar { display:block; height: 5px; background: var(--bg-2); border-radius: 99px; margin-top: 8px; overflow: hidden; }
  .tl-item .bar i { display: block; height: 100%; background: var(--grad); border-radius: 99px; }
  .tl-item.atual { border-color: var(--cyan); background: rgba(34,211,238,.07); }
  .tl-item.atual .n { color: var(--cyan); }
  .tl-item.sel { box-shadow: 0 0 0 3px rgba(34,211,238,.18); }
  .status-txt { font-size: 9px; font-weight: 800; letter-spacing: .06em; }
  .tl-prova {
    min-width: 84px; border: 1.5px dashed var(--red); border-radius: 11px;
    padding: 10px 11px; text-align: center; color: var(--red);
    font-size: 10.5px; font-weight: 800; display: flex; flex-direction: column; justify-content: center; gap: 3px;
  }
  .tl-prova small { color: var(--muted); font-weight: 500; }

  .perfil-grid { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 4px; }
  .perfil-grid .stat { flex: 1; min-width: 110px; }

  /* ---------- questionário ---------- */
  .q-progress { display: flex; align-items: center; gap: 10px; margin: 18px 0 8px; }
  .q-progress .bar { flex: 1; height: 6px; background: var(--bg-2); border-radius: 99px; overflow: hidden; }
  .q-progress .bar i { display: block; height: 100%; background: var(--grad); border-radius: 99px; transition: width .25s; }
  .q-progress .lbl { font-size: 11.5px; color: var(--muted); white-space: nowrap; }
  .q-card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 22px 20px; margin-top: 10px; }
  .q-card h2 { font-size: 17px; margin-bottom: 6px; }
  .q-hint { font-size: 12.5px; color: var(--muted); line-height: 1.55; margin-bottom: 16px; }
  .q-erro { color: var(--red); font-size: 12.5px; min-height: 18px; margin-top: 10px; }
  .q-nav { display: flex; gap: 10px; margin-top: 18px; }
  .q-nav .esp { flex: 1; }

  .opt-grid { display: flex; flex-wrap: wrap; gap: 9px; }
  .opt {
    background: var(--surface-2); color: var(--text-2);
    border: 1.5px solid var(--line-2); border-radius: 10px;
    padding: 11px 16px; font-size: 13.5px; font-weight: 600; min-height: 44px;
  }
  .opt[aria-pressed="true"] { background: rgba(34,211,238,.14); border-color: var(--cyan); color: var(--cyan); }
  .campo { margin-bottom: 14px; }
  .campo label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 5px; }
  .campo select, .campo input {
    width: 100%; max-width: 240px;
    background: var(--surface-2); color: var(--text);
    border: 1px solid var(--line-2); border-radius: 9px;
    padding: 11px 12px; font-size: 14px; min-height: 44px;
  }
  .busca-tema { width: 100%; margin-bottom: 12px; }
  .busca-tema input {
    width: 100%; background: var(--bg-2); color: var(--text);
    border: 1px solid var(--line); border-radius: 9px; padding: 10px 13px;
    font-size: 13px; min-height: 44px;
  }
  .tema-linha {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 11px 0; border-bottom: 1px solid var(--line);
  }
  .tema-linha:last-child { border-bottom: none; }
  .tema-linha .nome { flex: 1; min-width: 150px; font-size: 13.5px; font-weight: 600; }
  .seg { display: flex; gap: 4px; flex-wrap: wrap; }
  .seg button {
    background: var(--bg-2); color: var(--muted);
    border: 1.5px solid var(--line); font-size: 11px; font-weight: 700;
    padding: 8px 10px; min-height: 44px; border-radius: 8px;
  }
  .seg button[aria-pressed="true"].sd { background: rgba(248,113,113,.16); border-color: var(--red); color: var(--red); }
  .seg button[aria-pressed="true"].sr { background: rgba(251,191,36,.14); border-color: var(--amber); color: var(--amber); }
  .seg button[aria-pressed="true"].sf { background: rgba(52,211,153,.15); border-color: var(--green); color: var(--green); }
  .seg button[aria-pressed="true"].sn { background: var(--surface-2); border-color: var(--line-2); color: var(--text-2); }
  .resumo-grid { display: flex; gap: 10px; flex-wrap: wrap; margin: 12px 0; }
  .resumo-grid .stat { flex: 1; min-width: 104px; }

  /* ---------- toast ---------- */
  #toasts { position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%); z-index: 90; display: flex; flex-direction: column; gap: 8px; width: min(92vw, 420px); }
  .toast {
    background: var(--surface-2); border: 1px solid var(--line-2);
    border-left: 4px solid var(--cyan);
    border-radius: 11px; padding: 12px 15px; font-size: 13px;
    box-shadow: var(--shadow); animation: toastIn .22s ease-out;
  }
  .toast.ok { border-left-color: var(--green); }
  .toast.marco { border-left-color: var(--coral); }
  .toast b { display: block; margin-bottom: 2px; }
  .toast small { color: var(--muted); }
  @keyframes toastIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

  /* ---------- modal ---------- */
  .overlay {
    position: fixed; inset: 0; background: rgba(6,12,28,.72); z-index: 80;
    display: flex; align-items: center; justify-content: center; padding: 16px;
  }
  .modal {
    position: relative;
    background: var(--surface); border: 1px solid var(--line-2);
    border-radius: 16px; padding: 20px; width: min(94vw, 470px);
    max-height: 88vh; overflow-y: auto; box-shadow: var(--shadow);
  }
  .modal h3 { font-size: 16px; margin-bottom: 4px; padding-right: 36px; }
  .modal .sub { font-size: 12.5px; color: var(--muted); margin-bottom: 14px; }
  .modal .fechar-x {
    position: absolute; top: 12px; right: 12px;
    width: 36px; height: 36px; border-radius: 9px;
    background: transparent; border: 1px solid transparent; color: var(--muted);
    display: inline-flex; align-items: center; justify-content: center;
  }
  .modal .fechar-x:hover { color: var(--text); border-color: var(--line-2); }
  .stepper { display: flex; align-items: center; gap: 10px; }
  .stepper button {
    width: 44px; height: 44px; border-radius: 9px;
    background: var(--bg-2); border: 1px solid var(--line-2); color: var(--text);
    font-size: 18px; font-weight: 800;
  }
  .stepper .val { min-width: 52px; text-align: center; font-size: 18px; font-weight: 800; }

  /* ---------- bottom nav ---------- */
  .bnav {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 60;
    background: rgba(14,26,54,.96); backdrop-filter: blur(8px);
    border-top: 1px solid var(--line);
    display: flex; justify-content: space-around; padding: 6px 4px calc(6px + env(safe-area-inset-bottom));
  }
  .bnav button {
    background: none; border: none; color: var(--muted);
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    font-size: 10px; font-weight: 700; min-width: 64px; min-height: 48px; border-radius: 9px;
  }
  .bnav button:hover, .bnav button.on { color: var(--cyan); }
  @media (min-width: 768px) { .bnav { display: none; } body { padding-bottom: 60px; } }

  footer { text-align: center; color: var(--muted); font-size: 11px; margin-top: 34px; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    html { scroll-behavior: auto; }
  }
</style>
</head>
<body>

<div class="demo" role="region" aria-label="Controles de demonstração">
  <b>MOCKUP</b>
  <label for="demo-data">Simular data:</label>
  <select id="demo-data" onchange="app.render()">
    <option value="2026-08-10">Antes do início (10/08)</option>
    <option value="2026-09-30" selected>Semana 1 · quarta (30/09)</option>
    <option value="2026-10-14">Semana 3 · quarta (14/10)</option>
    <option value="2026-10-17">Semana 3 · sábado — dia do mini (17/10)</option>
    <option value="2026-11-10">Semana 7 · entre as provas (10/11)</option>
    <option value="2026-11-20">Depois da prova (20/11)</option>
  </select>
  <button type="button" onclick="app.demoExemplo()">Carregar dados de exemplo</button>
  <button type="button" onclick="app.resetar()">Zerar tudo</button>
</div>

<header class="top" id="app-top">
  <div class="top-in">
    <div class="brand">
      <span class="logo" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 32 32" fill="none" stroke="#06121f" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 18 L8 18 L13 27 L19 6 L30 6"/></svg></span>
      <span id="brand-txt"></span>
    </div>
    <div class="count-pill" id="pill-contagem"></div>
  </div>
</header>

<main class="wrap" id="root"></main>

<nav class="bnav" id="bnav" aria-label="Navegação rápida">
  <button type="button" data-alvo="sec-next" onclick="app.navTo(this)"><span class="ic" data-ic="target"></span>Hoje</button>
  <button type="button" data-alvo="sec-agenda" onclick="app.navTo(this)"><span class="ic" data-ic="cal"></span>Plano</button>
  <button type="button" data-alvo="sec-evo" onclick="app.navTo(this)"><span class="ic" data-ic="chart"></span>Evolução</button>
  <button type="button" data-alvo="sec-perfil" onclick="app.navTo(this)"><span class="ic" data-ic="user"></span>Perfil</button>
</nav>

<div id="toasts" aria-live="polite"></div>
<div id="modal-root"></div>

<script>
'use strict';
/* ============================================================
   CONFIG — fonte única de edição, datas e parâmetros.
   Nenhum ano ou data deve existir fora deste objeto.
   ============================================================ */
const CONFIG = {
  PRODUTO: 'Revisão Final',
  EDICAO: 'ENEM 2026',
  PROVA1: '2026-11-08',                 // 1º dia de prova
  PROVA2: '2026-11-15',                 // dia de Matemática
  INICIO: '2026-09-28',                 // segunda da Semana 1
  ALUNO: 'Ana Clara',                   // no app real: state.usuario.nome
  MIN_QUESTAO: 4,                       // minutos por questão (resolver + corrigir)
  MIN_VIDEO: 25,
  MIN_MINI: 50,
  MINI_QTDE: 15, MINI_POR_TEMA: 3,
  AMOSTRA_MIN_Q: 10,                    // reclassificação: mínimo de questões...
  AMOSTRA_MIN_FONTES: 2                 // ...ou mínimo de avaliações distintas
};

/* ============================================================
   ÍCONES SVG (stroke, padrão do app)
   ============================================================ */
const IC = {
  play:  '<svg width="ICS" height="ICS" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="6 3 20 12 6 21 6 3"/></svg>',
  book:  '<svg width="ICS" height="ICS" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>',
  clock: '<svg width="ICS" height="ICS" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>',
  check: '<svg width="ICS" height="ICS" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>',
  target:'<svg width="ICS" height="ICS" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>',
  chart: '<svg width="ICS" height="ICS" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 20V10M12 20V4M6 20v-6"/></svg>',
