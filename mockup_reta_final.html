<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MOCKUP · Revisão Final ENEM 2026 — Radix Matemática</title>
<style>
  /* =====================================================================
     DESIGN TOKENS — identidade Radix (azul profundo · ciano · coral)
     3 níveis de superfície + 1 de destaque. Bordas só onde separam função;
     profundidade vem de contraste, sombra e espaçamento.
     ===================================================================== */
  :root {
    --bg:#0b1530; --bg-deep:#08112a;
    --s1:#131f42; --s2:#1a2a55; --s3:#223768;
    --line:rgba(120,150,220,.14); --line-2:rgba(120,150,220,.28);
    --text:#f1f4fc; --text-2:#c9d3ee; --muted:#8ea2cc;
    --cyan:#22d3ee; --cyan-2:#67e8f9; --blue:#3b82f6; --coral:#ff7a5c;
    --red:#fb7185; --green:#34d399; --amber:#fbbf24; --violet:#a78bfa;
    --grad:linear-gradient(135deg,#22d3ee 0%,#3b82f6 100%);
    --r-sm:8px; --r:12px; --r-lg:16px; --r-xl:20px;
    --sh-1:0 1px 2px rgba(0,0,0,.25),0 6px 18px -10px rgba(0,0,0,.6);
    --sh-2:0 2px 6px rgba(0,0,0,.3),0 18px 40px -18px rgba(0,0,0,.7);
    --sh-glow:0 0 0 1px rgba(34,211,238,.35),0 18px 48px -18px rgba(34,211,238,.45);
    --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:20px; --sp-6:24px; --sp-8:32px;
    --fs-xs:12px; --fs-sm:14px; --fs-md:16px; --fs-lg:18px; --fs-xl:22px; --fs-2xl:28px;
    --lh:1.55; --dur:.16s; --nav-h:64px;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
  body{font-family:'Inter',-apple-system,'Segoe UI',Roboto,sans-serif;font-size:var(--fs-md);line-height:var(--lh);background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:calc(var(--nav-h) + 24px);-webkit-font-smoothing:antialiased;overflow-x:hidden}
  body.modal-aberto{overflow:hidden}
  img,svg{max-width:100%}
  button{font-family:inherit;font-size:inherit;cursor:pointer;color:inherit}
  button:disabled{opacity:.45;cursor:not-allowed}
  select,input{font-family:inherit;font-size:var(--fs-md)}
  :focus{outline:none}
  :focus-visible{outline:2px solid var(--cyan-2);outline-offset:2px;border-radius:var(--r-sm)}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

  /* ---------- tipografia ---------- */
  .h1{font-size:var(--fs-2xl);font-weight:800;letter-spacing:-.02em;line-height:1.2}
  .h2{font-size:var(--fs-xl);font-weight:800;letter-spacing:-.01em;line-height:1.25}
  .h3{font-size:var(--fs-lg);font-weight:700;line-height:1.3}
  .eyebrow{font-size:var(--fs-xs);font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--cyan)}
  .sub{font-size:var(--fs-sm);color:var(--muted);line-height:var(--lh)}
  .meta{font-size:var(--fs-xs);color:var(--muted)}
  .txt-2{color:var(--text-2)}
  .sec-title{display:flex;align-items:center;gap:var(--sp-2);font-size:var(--fs-lg);font-weight:800;margin-bottom:var(--sp-3)}
  .sec-title .ic{color:var(--cyan);display:inline-flex}
  .sec-title .lado{margin-left:auto;display:inline-flex;align-items:center;gap:var(--sp-2);font-weight:500;font-size:var(--fs-sm);flex-wrap:wrap;justify-content:flex-end}

  /* ---------- superfícies ---------- */
  .card{background:var(--s1);border-radius:var(--r-lg);padding:var(--sp-5);box-shadow:var(--sh-1)}
  .card-2{background:var(--s2);border-radius:var(--r);padding:var(--sp-4)}
  .divider{height:1px;background:var(--line);margin:var(--sp-4) 0}

  /* ---------- botões ---------- */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--sp-2);border:none;border-radius:var(--r);min-height:44px;padding:10px 18px;font-size:var(--fs-sm);font-weight:700;white-space:nowrap;transition:transform var(--dur),box-shadow var(--dur),background var(--dur),border-color var(--dur),color var(--dur)}
  .btn-pri{background:var(--grad);color:#061125;box-shadow:0 6px 18px -8px rgba(34,211,238,.6)}
  .btn-pri:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 10px 26px -8px rgba(34,211,238,.7)}
  .btn-pri:active:not(:disabled){transform:translateY(0) scale(.99);filter:brightness(.95)}
  .btn-sec{background:var(--s3);color:var(--text);border:1px solid var(--line-2)}
  .btn-sec:hover:not(:disabled){border-color:var(--cyan);color:var(--cyan-2)}
  .btn-ghost{background:transparent;color:var(--text-2);border:1px solid transparent}
  .btn-ghost:hover:not(:disabled){background:rgba(120,150,220,.1);color:var(--text)}
  .btn-danger{background:transparent;color:var(--red);border:1px solid rgba(251,113,133,.45)}
  .btn-danger:hover{background:rgba(251,113,133,.1);border-color:var(--red)}
  .btn-sm{min-height:40px;padding:8px 14px;font-size:var(--fs-sm);border-radius:var(--r-sm)}
  .btn-block{width:100%}
  .btn .ic{display:inline-flex}

  /* ---------- chips / tooltips ---------- */
  .chip{display:inline-flex;align-items:center;gap:4px;font-size:var(--fs-xs);font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap;line-height:1.4}
  .chip-alta{background:rgba(251,113,133,.16);color:#fda4af}
  .chip-padrao{background:rgba(251,191,36,.14);color:#fcd34d}
  .chip-leve{background:rgba(52,211,153,.14);color:#6ee7b7}
  .chip-geo{background:rgba(167,139,250,.16);color:#c4b5fd}
  .chip-neutro{background:rgba(120,150,220,.14);color:var(--text-2)}
  .chip-ok{background:rgba(52,211,153,.16);color:var(--green)}
  .chip-atraso{background:rgba(251,191,36,.16);color:var(--amber)}
  .chip-cyan{background:rgba(34,211,238,.14);color:var(--cyan-2)}
  .tip{position:relative;cursor:help}
  .tip::after{content:attr(data-tip);position:absolute;left:0;bottom:calc(100% + 6px);width:max-content;max-width:260px;background:#0a1330;color:var(--text-2);font-size:var(--fs-xs);font-weight:500;line-height:1.45;padding:8px 10px;border-radius:var(--r-sm);border:1px solid var(--line-2);box-shadow:var(--sh-2);opacity:0;pointer-events:none;transform:translateY(4px);transition:opacity var(--dur),transform var(--dur);z-index:30;white-space:normal}
  .tip:hover::after,.tip:focus-visible::after{opacity:1;transform:none}

  /* ---------- barra demo ---------- */
  .demo{background:#1d1741;border-bottom:1px solid #3b2f7a;padding:8px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:var(--fs-xs);color:#c4b8f7}
  .demo b{letter-spacing:.1em}
  .demo select,.demo button{background:var(--s2);color:var(--text-2);border:1px solid var(--line-2);border-radius:var(--r-sm);padding:6px 10px;font-size:var(--fs-xs);min-height:36px}
  .demo button:hover{border-color:var(--coral);color:var(--coral)}

  /* ---------- header + nav desktop ---------- */
  .top{position:sticky;top:0;z-index:40;background:rgba(11,21,48,.86);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
  .top-in{max-width:1180px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:var(--sp-4)}
  .brand{display:flex;align-items:center;gap:10px;font-size:var(--fs-sm);font-weight:800;white-space:nowrap}
  .logo{width:34px;height:34px;border-radius:10px;background:var(--grad);display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 4px 12px -4px rgba(34,211,238,.6)}
  .brand small{color:var(--cyan);font-weight:700}
  .dnav{display:none;margin-left:auto;gap:4px}
  .dnav button{background:none;border:none;color:var(--muted);font-size:var(--fs-sm);font-weight:700;padding:8px 14px;border-radius:999px;min-height:40px;transition:background var(--dur),color var(--dur)}
  .dnav button:hover{color:var(--text);background:rgba(120,150,220,.1)}
  .dnav button.on{color:var(--cyan-2);background:rgba(34,211,238,.12)}
  .count-pill{display:inline-flex;align-items:center;gap:7px;background:var(--s2);border-radius:999px;padding:8px 14px;font-size:var(--fs-xs);color:var(--text-2);white-space:nowrap;margin-left:auto}
  .count-pill b{color:var(--coral);font-size:var(--fs-md)}
  .dnav ~ .count-pill{margin-left:0}

  /* ---------- layout ---------- */
  .wrap{max-width:1180px;margin:0 auto;padding:0 16px}
  .layout{display:grid;grid-template-columns:1fr;gap:var(--sp-6);align-items:start}
  .col-main{min-width:0}
  .col-side{min-width:0;display:none}
  .col-side .stack{position:sticky;top:72px;display:flex;flex-direction:column;gap:var(--sp-4)}
  section{scroll-margin-top:76px}
  .stack-v>*+*{margin-top:var(--sp-6)}
  .only-mobile{display:block}
  footer{text-align:center;color:var(--muted);font-size:var(--fs-xs);margin-top:var(--sp-8);padding-bottom:var(--sp-4)}

  /* ---------- bottom nav (celular/tablet) ---------- */
  .bnav{position:fixed;left:0;right:0;bottom:0;z-index:60;height:calc(var(--nav-h) + env(safe-area-inset-bottom));background:rgba(8,17,42,.95);backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;justify-content:space-around;align-items:stretch;padding:0 4px env(safe-area-inset-bottom)}
  .bnav button{flex:1;background:none;border:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:var(--fs-xs);font-weight:700;min-height:48px;border-radius:var(--r);position:relative}
  .bnav button .ic{display:inline-flex;transition:transform var(--dur)}
  .bnav button.on{color:var(--cyan-2)}
  .bnav button.on::before{content:'';position:absolute;top:0;width:28px;height:3px;border-radius:0 0 3px 3px;background:var(--grad)}
  .bnav button.on .ic{transform:translateY(-1px)}

  /* ---------- saudação ---------- */
  .greet{display:flex;align-items:flex-end;justify-content:space-between;gap:var(--sp-3);flex-wrap:wrap;margin-top:var(--sp-5)}
  .greet .sub{margin-top:2px}
  .aviso{border-left:3px solid var(--amber);background:rgba(251,191,36,.07);padding:var(--sp-3) var(--sp-4);border-radius:var(--r-sm);font-size:var(--fs-sm);line-height:var(--lh)}
  .aviso b{color:var(--text)}

  /* ---------- PRÓXIMO PASSO (hero) ---------- */
  .next{position:relative;overflow:hidden;background:linear-gradient(150deg,#16305e 0%,#111f47 55%,#0f1a3d 100%);border-radius:var(--r-xl);padding:var(--sp-6);box-shadow:var(--sh-glow)}
  .next::before{content:'';position:absolute;inset:0;background:radial-gradient(600px 200px at 100% 0%,rgba(34,211,238,.18),transparent 60%);pointer-events:none}
  .next>*{position:relative}
  .next h2{font-size:var(--fs-xl);margin:var(--sp-2) 0 var(--sp-1);line-height:1.25}
  .next .infos{display:flex;gap:var(--sp-4);flex-wrap:wrap;font-size:var(--fs-sm);color:var(--text-2);margin:var(--sp-2) 0}
  .next .infos span{display:inline-flex;align-items:center;gap:6px}
  .next .just{font-size:var(--fs-sm);color:var(--text-2);border-left:3px solid var(--cyan);padding:2px 0 2px var(--sp-3);margin:var(--sp-4) 0 var(--sp-5);line-height:var(--lh)}
  .next .acts{display:flex;gap:var(--sp-3);flex-wrap:wrap}
  .next.done{box-shadow:var(--sh-1);background:linear-gradient(150deg,#12304a,#111f47)}
  .next.quiet{box-shadow:var(--sh-1)}

  /* ---------- resumo da semana ---------- */
  .resumo{display:grid;grid-template-columns:auto 1fr;gap:var(--sp-4);align-items:center}
  .ring{position:relative;width:84px;height:84px;flex-shrink:0}
  .ring svg{transform:rotate(-90deg)}
  .ring .pct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:var(--fs-lg);font-weight:800}
  .kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--sp-2) var(--sp-3)}
  .kpi{min-width:0}
  .kpi .v{font-size:var(--fs-md);font-weight:800;line-height:1.2}
  .kpi .l{font-size:var(--fs-xs);color:var(--muted);margin-top:1px}
  .resumo-foot{grid-column:1/-1;display:flex;align-items:center;gap:var(--sp-2);flex-wrap:wrap;font-size:var(--fs-sm);color:var(--text-2);padding-top:var(--sp-3);border-top:1px solid var(--line)}
  .resumo-foot .chip{margin-left:auto}

  /* ---------- agenda ---------- */
  .grupo{margin-top:var(--sp-5)}
  .grupo-h{display:flex;align-items:center;gap:var(--sp-2);margin-bottom:var(--sp-2);font-size:var(--fs-xs);font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
  .grupo-h.hoje{color:var(--cyan-2)}
  .grupo-h.atraso{color:var(--amber)}
  .grupo-h .n{background:rgba(120,150,220,.16);color:var(--text-2);border-radius:999px;padding:1px 8px;font-size:var(--fs-xs);letter-spacing:0}
  .dia-lbl{font-size:var(--fs-xs);font-weight:700;color:var(--muted);margin:var(--sp-3) 0 var(--sp-2);letter-spacing:.04em}
  .atv{display:grid;grid-template-columns:auto 1fr;grid-template-areas:"chk body" "acts acts";gap:var(--sp-3) var(--sp-3);background:var(--s1);border-radius:var(--r-lg);padding:var(--sp-4);margin-bottom:var(--sp-3);box-shadow:var(--sh-1);border-left:3px solid transparent;transition:background var(--dur),transform var(--dur),opacity var(--dur)}
  .atv:hover{background:#15234b}
  .atv.late{border-left-color:var(--amber)}
  .atv.done{opacity:.66;border-left-color:var(--green)}
  .atv.done .atv-titulo{text-decoration:line-through;text-decoration-color:rgba(255,255,255,.35)}
  .atv.flash{animation:flashOk .55s ease-out}
  @keyframes flashOk{0%{box-shadow:0 0 0 0 rgba(52,211,153,.6)}100%{box-shadow:0 0 0 14px rgba(52,211,153,0)}}
  .chk{grid-area:chk;width:44px;height:44px;border-radius:12px;flex-shrink:0;border:2px solid var(--line-2);background:var(--s2);display:inline-flex;align-items:center;justify-content:center;color:transparent;transition:all var(--dur);padding:0;align-self:start}
  .chk:hover{border-color:var(--green)}
  .chk[aria-checked="true"]{background:var(--green);border-color:var(--green);color:#052e1f}
  .atv-body{grid-area:body;min-width:0}
  .atv-top{display:flex;align-items:center;gap:var(--sp-2);flex-wrap:wrap;font-size:var(--fs-xs);color:var(--muted);font-weight:700;letter-spacing:.04em;text-transform:uppercase}
  .atv-titulo{font-size:var(--fs-md);font-weight:800;line-height:1.3;margin:3px 0 4px;color:var(--text)}
  .atv-meta{display:flex;align-items:center;gap:var(--sp-2) var(--sp-3);flex-wrap:wrap;font-size:var(--fs-sm);color:var(--muted)}
  .atv-meta .ok{color:var(--green);font-weight:700}
  .atv-acts{grid-area:acts;display:flex;gap:var(--sp-2);align-items:center;flex-wrap:wrap}
  .atv-acts .btn{flex:1 1 160px}
  .reag{display:inline-flex;align-items:center;gap:6px;flex:1 1 160px}
  .reag select{width:100%;background:var(--s2);color:var(--text-2);border:1px solid var(--line-2);border-radius:var(--r-sm);padding:9px 10px;min-height:40px;font-size:var(--fs-sm)}
  .vazio{border:1px dashed var(--line-2);border-radius:var(--r-lg);padding:var(--sp-5);text-align:center;font-size:var(--fs-sm);color:var(--muted);line-height:var(--lh)}
  .vazio b{color:var(--text-2)}
  .fora{border:1px dashed var(--line-2);border-radius:var(--r);padding:var(--sp-3) var(--sp-4);font-size:var(--fs-sm);color:var(--muted);margin-bottom:var(--sp-2);line-height:var(--lh)}
  .fora b{color:var(--text-2)}
  details.concl{margin-top:var(--sp-4)}
  details.concl summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:var(--sp-2);min-height:44px;font-size:var(--fs-xs);font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
  details.concl summary::-webkit-details-marker{display:none}
  details.concl summary .chev{display:inline-flex;transition:transform var(--dur)}
  details.concl[open] summary .chev{transform:rotate(90deg)}
  .mini{display:grid;grid-template-columns:auto 1fr;grid-template-areas:"ic inf" "act act";gap:var(--sp-3);background:linear-gradient(135deg,var(--s2),var(--s1));border-radius:var(--r-lg);padding:var(--sp-4);margin-top:var(--sp-5);box-shadow:var(--sh-1)}
  .mini .ic{grid-area:ic;color:var(--cyan);display:inline-flex;width:44px;height:44px;border-radius:12px;background:rgba(34,211,238,.12);align-items:center;justify-content:center}
  .mini .inf{grid-area:inf;min-width:0}
  .mini .t{font-weight:800;font-size:var(--fs-md)}
  .mini .s{font-size:var(--fs-sm);color:var(--muted);margin-top:2px}
  .mini .act{grid-area:act;display:flex;align-items:center;gap:var(--sp-3);flex-wrap:wrap}
  .mini-res{display:inline-flex;align-items:center;gap:var(--sp-3);background:rgba(52,211,153,.1);border-radius:var(--r);padding:8px 12px}
  .mini-res b{color:var(--green);font-size:var(--fs-lg)}

  /* ---------- abas ---------- */
  .tabs{display:flex;gap:4px;background:var(--s1);border-radius:999px;padding:4px;box-shadow:var(--sh-1);margin-bottom:var(--sp-4);overflow-x:auto}
  .tabs button{flex:1;background:none;border:none;color:var(--muted);font-size:var(--fs-sm);font-weight:700;padding:10px 14px;border-radius:999px;min-height:44px;white-space:nowrap;transition:background var(--dur),color var(--dur)}
  .tabs button[aria-selected="true"]{background:var(--s3);color:var(--text)}
  .tabs button:hover{color:var(--text)}
  .tabpanel[hidden]{display:none}

  /* ---------- evolução ---------- */
  .evo{display:flex;align-items:flex-end;gap:var(--sp-2);height:150px;margin-top:var(--sp-6);position:relative;padding-top:var(--sp-4)}
  .evo .meta-line{position:absolute;left:0;right:0;border-top:2px dashed rgba(52,211,153,.6);pointer-events:none}
  .evo .meta-line small{position:absolute;right:0;top:-18px;font-size:var(--fs-xs);color:var(--green);font-weight:700}
  .evo-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%;background:none;border:none;border-radius:var(--r-sm);padding:0 2px;min-width:0}
  .evo-col:hover .evo-bar{filter:brightness(1.15)}
  .evo-col[aria-pressed="true"] .evo-l{color:var(--cyan-2);font-weight:800}
  .evo-bar{width:100%;max-width:46px;border-radius:6px 6px 0 0;background:var(--grad);min-height:4px;transition:height .3s}
  .evo-bar.atual{background:linear-gradient(180deg,var(--coral),#f59e0b)}
  .evo-bar.off{background:transparent;border:1px dashed var(--line-2)}
  .evo-bar.sel{outline:2px solid var(--cyan-2);outline-offset:2px}
  .evo-v{font-size:var(--fs-xs);font-weight:800;color:var(--text)}
  .evo-l{font-size:var(--fs-xs);color:var(--muted)}
  .legenda{display:flex;gap:var(--sp-4);flex-wrap:wrap;font-size:var(--fs-xs);color:var(--muted);margin-top:var(--sp-3)}
  .legenda i{display:inline-block;width:10px;height:10px;border-radius:3px;vertical-align:-1px;margin-right:5px}
  .diag{border-left:3px solid var(--cyan);padding-left:var(--sp-4);margin-top:var(--sp-5)}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:var(--sp-2);margin-top:var(--sp-3)}
  .stat{background:var(--s2);border-radius:var(--r-sm);padding:10px 12px;min-width:0}
  .stat .v{font-size:var(--fs-md);font-weight:800;line-height:1.25;overflow-wrap:anywhere}
  .stat .l{font-size:var(--fs-xs);color:var(--muted);letter-spacing:.05em;margin-top:2px}
  .stat.pos .v{color:var(--green)} .stat.neg .v{color:var(--red)} .stat.warn .v{color:var(--amber)}
  .rec{font-size:var(--fs-sm);color:var(--text-2);margin-top:var(--sp-3);line-height:var(--lh)}

  /* ---------- linha do tempo ---------- */
  .tl{display:flex;gap:var(--sp-2);overflow-x:auto;padding:4px 2px 10px;scroll-snap-type:x proximity}
  .tl::-webkit-scrollbar{height:6px} .tl::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:3px}
  .tl-item{scroll-snap-align:start;min-width:132px;text-align:left;background:var(--s1);border:2px solid transparent;border-radius:var(--r);padding:10px 12px;color:var(--text-2);box-shadow:var(--sh-1);transition:border-color var(--dur),transform var(--dur)}
  .tl-item:hover{transform:translateY(-1px)}

const T = id => TEMAS.find(t => t.id === id);
// Faixa de incidência -> multiplicador do peso e rótulo para o aluno
const INC_ALTA = 3.0, INC_MEDIA = 1.5;
function faixaInc(temaId) {
  const t = T(temaId);
  const v = (t && t.inc) || 1;
  // Multiplicadores calibrados para NUNCA inverter a dificuldade:
  // difícil×1,0 (=3) > regular×1,4 (=2,8) > regular×1,15 (=2,3) > regular (=2) > domina×1,4 (=1,4)
  if (v >= INC_ALTA)  return { mult:1.4,  rotulo:'ALTA INCIDÊNCIA',  v };
  if (v >= INC_MEDIA) return { mult:1.15, rotulo:'MÉDIA INCIDÊNCIA', v };
  return { mult:1.0, rotulo:null, v };
}

const dt = s => new Date(s + 'T12:00:00');
function addDias(d, n) { const x = new Date(d); x.setDate(x.getDate() + n); return x; }
function fmtCurto(d) { return d.toLocaleDateString('pt-BR', { day:'2-digit', month:'2-digit' }); }
function fmtSemDia(d) { return d.toLocaleDateString('pt-BR', { weekday:'short' }).replace('.','').toUpperCase(); }
function rotSemana(s) { return fmtCurto(dt(s.ini)) + ' a ' + fmtCurto(addDias(dt(s.ini), (s.dias || 7) - 1)); }
function esc(x) {
  return String(x == null ? '' : x).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/* ============================================================
   ESTADO — schema espelha as futuras tabelas do Supabase:
     perfil → revisao_perfil    (1 linha por aluno)
     ov     → revisao_progresso (aluno, semana, atividade_key, dia, feito_em, acertos, total)
     minis  → revisao_mini      (aluno, semana, acertos_por_tema JSONB, total, feito_em)
     planos → revisao_plano     (aluno, semana, criado_em, budget, itens JSONB)
              — snapshot congelado da dose no momento da 1ª ação da semana
   ============================================================ */
const KEY = 'mockup_revisao_final_v3';
const app = {
  perfil: null, ov: {}, minis: {}, planos: {},

  qStep: 0, _qTemp: null, _editando: false,

  carregar() {

        if (this.perfil && !this.perfil.dias) {
          const nd = Math.min(this.perfil.diasSemana || 5, 7);
          this.perfil.dias = []; for (let i = 0; i < nd; i++) this.perfil.dias.push(i);
        }
      }
    } catch(e) {}
  },
  salvar() {
    try { localStorage.setItem(KEY, JSON.stringify({ v:3, perfil:this.perfil, ov:this.ov, minis:this.minis, planos:this.planos })); } catch(e) {}
  },
  demoExemplo() {

          hits: it.tipo==='q' ? Math.max(0, Math.round(it.questoes * (fraco ? 0.35 : 0.85))) : null,

    this.minis[2] = { porTema: { pg:2, trigonometria:2, logica:2, conjuntos:3, 'geo-espacial':2 },              total:11, em:'2026-10-10T18:00:00' };

  },

  hoje() {
    const v = document.getElementById('demo-data').value;
    return v === 'real' ? new Date() : dt(v);
  },
  semanaAtualN() {
    const h = this.hoje();
    for (const s of SEMANAS) {
      if (h >= dt(s.ini) && h <= addDias(dt(s.ini), (s.dias||7) - 1)) return s.n;
    }
    return null;
  },
  posProva() { return this.hoje() > dt(CONFIG.PROVA2); },

  /* ============================================================
     MOTOR — amostra, reclassificação bidirecional e dosagem rígida
     ============================================================ */
  amostraTema(temaId) {
    let hits = 0, total = 0, fontes = 0;
    for (const k in this.ov) {
      const o = this.ov[k];
      if (k.split(':')[1] === temaId && o.done && o.total) { hits += o.hits||0; total += o.total; fontes++; }
    }
    for (const n in this.minis) {
      const m = this.minis[n];
      if (m.porTema && m.porTema[temaId] != null) { hits += m.porTema[temaId]; total += CONFIG.MINI_POR_TEMA; fontes++; }
    }
    return { hits, total, fontes };
  },
  // Reclassificação BIDIRECIONAL: com amostra confiável, o desempenho manda —
  // inclusive rebaixando um "tenho dificuldade" declarado quando o aluno prova domínio.
  efDif(temaId) {
    const declRaw = (this.perfil && this.perfil.dif[temaId]) || 0;   // -1 | 0 | 1 | 2 | 9
    const decl = declRaw === -1 ? -1 : declRaw === 1 ? 1 : 0;
    const a = this.amostraTema(temaId);
    const amostraOk = a.total >= CONFIG.AMOSTRA_MIN_Q || a.fontes >= CONFIG.AMOSTRA_MIN_FONTES;
    if (amostraOk && a.total > 0) {
      const pct = a.hits / a.total;
      const v = pct < 0.5 ? -1 : pct < 0.8 ? 0 : 1;
      return { v, auto: v !== decl, pct, amostra: a.total };
    }
    return { v: decl, auto: false };
  },

  // Dosagem com TETO RÍGIDO: totalMin <= budget, sempre.
  // Prioridade de alocação: dificuldade > geometria > dose padrão > domínio.
  dosarSemana(sem) {
    const p = this.perfil;
    const nDias = sem.dias || 7;
    // dias REAIS marcados pelo aluno (0=SEG … 6=DOM), restritos aos que existem na semana
    let diasAtivos = (p.dias && p.dias.length ? p.dias.slice() : [0,1,2,3,4]).sort((a,b)=>a-b).filter(d => d < nDias);
    if (!diasAtivos.length) diasAtivos = [nDias - 1];   // ex.: só DOM na Semana 7 (6 dias) -> SÁB
    // Orçamento pelos dias que REALMENTE existem na semana. Sem isso, quem
    // marca domingo recebia na Semana 7 (que acaba no sábado da prova) uma
    // carga de 7 dias para caber em 6.
    const budget = Math.round(p.horasDia * 60 * diasAtivos.length);
    const avisos = [], fora = [];

    const base = sem.temas.map(id => {
      const ef = this.efDif(id);
      return { temaId:id, nome:T(id).nome, ef, geo:false };
    });
    const efG = this.efDif(sem.geo.id);
    base.push({ temaId:sem.geo.id, nome:T(sem.geo.id).nome + ' ' + sem.geo.s, ef:efG, geo:true });
    base.forEach(b => {
      // peso = dificuldade x incidência no ENEM.
      // Dificuldade continua mandando (3/2/1); a incidência modula em até 40%,
      // então um assunto que cai muito ganha mais questões que um raro de
      // mesma dificuldade — sem inverter a prioridade de quem tem dificuldade.
      const pesoDif = b.ef.v===-1 ? 3 : b.ef.v===1 ? 1 : 2;
      b.inc = faixaInc(b.temaId);
      b.peso = pesoDif * b.inc.mult;
      if (b.geo) b.peso = Math.max(b.peso, 2);
      // desempate na alocação: dificuldade > geometria > incidência > domínio
      b.rank = b.ef.v===-1 ? 4 : b.geo ? 3 : (b.inc.mult > 1 ? 2.5 : 2);
      if (b.ef.v===1 && !b.geo) b.rank = 1;
    });
    base.sort((a,b) => (b.rank - a.rank) || (b.inc.v - a.inc.v));

    // mini é a âncora — só sai se nem ele couber
    let temMini = true;
    let restante = budget - CONFIG.MIN_MINI;
    if (restante < 0) {
      temMini = false; restante = budget;
      avisos.push('Seu tempo semanal não cobre nem o mini-simulado (' + CONFIG.MIN_MINI + ' min). Amplie a disponibilidade no perfil.');
    }

    // vídeos: só dificuldade efetiva, em ordem de prioridade, e só se sobrar
    // espaço para o vídeo + ao menos 2 questões de prática do próprio tema
    base.forEach(b => { b.video = false; b.questoes = 0; });
    for (const b of base) {
      if (b.ef.v === -1 && T(b.temaId).video && restante >= CONFIG.MIN_VIDEO + 2*CONFIG.MIN_QUESTAO) {
        b.video = true; restante -= CONFIG.MIN_VIDEO;
      }
    }

    // questões: floor proporcional (sem mínimo forçado) + sobra distribuída
    // 1 questão por vez em ordem de prioridade — nunca ultrapassa o restante
    const somaP = base.reduce((s,b)=>s+b.peso, 0);
    base.forEach(b => { b.questoes = Math.floor((restante * b.peso / somaP) / CONFIG.MIN_QUESTAO); });
    let usado = base.reduce((s,b)=>s+b.questoes, 0) * CONFIG.MIN_QUESTAO;
    let i = 0, guard = 1000;
    while (restante - usado >= CONFIG.MIN_QUESTAO && guard-- > 0) {
      base[i % base.length].questoes++;
      usado += CONFIG.MIN_QUESTAO;
      i++;
    }

    base.forEach(b => {
      if (b.questoes === 0 && !b.video) {
        fora.push({ nome: b.nome, motivo: temMini
          ? 'Este tema será contemplado apenas no mini-simulado porque seu orçamento semanal foi totalmente distribuído entre as prioridades mais altas.'
          : 'Sem tempo disponível para este tema nesta semana.' });
      }
    });

    const itens = [];
    base.forEach(b => {
      if (b.video) itens.push({ key:'s'+sem.n+':'+b.temaId+':v', temaId:b.temaId, tipo:'v',
        titulo:'Assistir vídeo-aula — ' + b.nome, min:CONFIG.MIN_VIDEO, questoes:0,
        peso:b.peso, geo:b.geo, auto:b.ef.auto, efv:b.ef.v, inc:b.inc });
      if (b.questoes > 0) itens.push({ key:'s'+sem.n+':'+b.temaId+':q', temaId:b.temaId, tipo:'q', questoes:b.questoes,
        titulo:'Resolver ' + b.questoes + ' questões — ' + b.nome, min:b.questoes*CONFIG.MIN_QUESTAO,
        peso:b.peso, geo:b.geo, auto:b.ef.auto, efv:b.ef.v, inc:b.inc });
    });
    itens.forEach((it, idx) => { it.diaDefault = diasAtivos[idx % diasAtivos.length]; });

    const totalMin = itens.reduce((s,it)=>s+it.min, 0) + (temMini ? CONFIG.MIN_MINI : 0);
    return { budget, totalMin, itens, avisos, fora, diasAtivos, temMini, congelado:false };
  },

  /* ---------- congelamento ---------- */
  congelarSemana(n) {
    if (this.planos[n]) return;
    const sem = SEMANAS.find(s => s.n === n);
    const d = this.dosarSemana(sem);
    d.congelado = true;
    d.criadoEm = new Date().toISOString();
    this.planos[n] = d;
  },
  dosePara(sem) { return this.planos[sem.n] || this.dosarSemana(sem); },

  diaDe(it) {
    const o = this.ov[it.key];
    return (o && o.dia != null) ? o.dia : it.diaDefault;
  },
  feito(key) { const o = this.ov[key]; return !!(o && o.done); },

  /* ============================================================
     AÇÕES
     ============================================================ */
  toast(tipo, titulo, corpo) {
    const box = document.getElementById('toasts');
    const el = document.createElement('div');
    el.className = 'toast ' + (tipo||'');
    el.innerHTML = '<b>' + esc(titulo) + '</b>' + (corpo ? '<small>' + esc(corpo) + '</small>' : '');
    box.appendChild(el);
    setTimeout(() => el.remove(), 4500);
  },
  demoAbrir(temaId) {
    this.toast('', 'Demonstração', 'No app real: abre o banco de questões filtrado em "' + (T(temaId)||{nome:'?'}).nome + '".');
  },

  concluir(key) {
    const n = parseInt(key.slice(1));
    if (this.feito(key)) {   // desfazer
      const o = this.ov[key]; o.done = null; o.hits = null; o.total = null;
      this.salvar(); this.render({ foco: 'chk:' + key });
      this.anunciar('Conclusão desfeita.');
      return;
    }
    this.congelarSemana(n);   // 1ª ação da semana congela o plano
    const sem = SEMANAS.find(s => s.n === n);
    const it = this.dosePara(sem).itens.find(x => x.key === key);
    if (it && it.tipo === 'q') { this.modalAcertos(it); return; }
    this._marcar(key, null, null);
  },
  _marcar(key, hits, total) {
    const n = parseInt(key.slice(1));
    this.congelarSemana(n);
    const o = this.ov[key] || (this.ov[key] = {});
    o.done = new Date().toISOString();
    if (hits != null) { o.hits = hits; o.total = total; }
    this.salvar();
    this.fecharModal();
    this.render({ foco: 'chk:' + key, flash: key });
    const prox = this.proximaAtividade(n);
    if (!prox && !this.minis[n]) this.toast('ok', 'Atividade concluída', 'Falta só o mini-simulado para fechar a semana.');
    else if (prox) this.toast('ok', 'Atividade concluída', 'Próxima sugestão: ' + prox.titulo);
    else this.celebrarSemana(n);
  },

  /* ---------- modal genérico acessível ---------- */
  _modalPrev: null, _modalKeyFn: null,
  abrirModal(html) {
    this._modalPrev = document.activeElement;
    const root = document.getElementById('modal-root');
    root.innerHTML = html;
    document.body.classList.add('modal-aberto');
    const box = root.querySelector('.modal');
    if (!box) return;
    const focaveis = () => Array.prototype.filter.call(
      box.querySelectorAll('button, [href], input, select, textarea'),
      el => !el.disabled && el.offsetParent !== null);
    const fs = focaveis();
    if (fs.length) fs[0].focus();
    const self = this;
    this._modalKeyFn = function(e) {
      if (e.key === 'Escape') { self.fecharModal(); return; }
      if (e.key === 'Tab') {
        const f = focaveis();
        if (!f.length) return;
        const first = f[0], last = f[f.length-1];
        if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
        else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
      }
    };
    document.addEventListener('keydown', this._modalKeyFn);
  },
  fecharModal() {
    if (this._modalKeyFn) { document.removeEventListener('keydown', this._modalKeyFn); this._modalKeyFn = null; }
    document.getElementById('modal-root').innerHTML = '';
    document.body.classList.remove('modal-aberto');
    if (this._modalPrev && this._modalPrev.focus) { try { this._modalPrev.focus(); } catch(e) {} }
    this._modalPrev = null;
  },
  _xFechar() {
    return '<button type="button" class="fechar-x" aria-label="Fechar" onclick="app.fecharModal()">' + ic('x',16) + '</button>';
  },

  /* ---------- registro de acertos (sem indução) ---------- */
  _hitsTmp: null, _hitsMax: 0, _hitsKey: '',
  modalAcertos(it) {
    this._hitsTmp = null; this._hitsMax = it.questoes; this._hitsKey = it.key;
    this.abrirModal(
      '<div class="overlay" onclick="if(event.target===this)app.fecharModal()">' +
      '<div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-titulo">' + this._xFechar() +
      '<h3 id="modal-titulo">Quantas você acertou?</h3>' +
      '<p class="sub">' + esc(it.titulo) + ' · o resultado alimenta o ajuste automático das próximas semanas. Se ainda não corrigiu, conclua sem registrar.</p>' +
      '<div class="stepper">' +
        '<button type="button" aria-label="Diminuir" onclick="app._stepHits(-1)">&minus;</button>' +
        '<span class="val" id="hits-val" aria-live="polite">&mdash;</span>' +
        '<button type="button" aria-label="Aumentar" onclick="app._stepHits(1)">+</button>' +
        '<span class="txt-mini" id="hits-de">de ' + it.questoes + ' questões</span>' +
      '</div>' +
      '<div class="q-nav">' +
        '<button type="button" class="btn btn-ghost btn-sm" onclick="app._marcar(app._hitsKey, null, null)">Concluir sem registrar</button>' +
        '<span class="esp"></span>' +
        '<button type="button" class="btn btn-pri btn-sm" id="hits-salvar" disabled onclick="app._marcar(app._hitsKey, app._hitsTmp, app._hitsMax)">Salvar</button>' +
      '</div></div></div>'
    );
  },
  _stepHits(d) {
    if (this._hitsTmp == null) this._hitsTmp = (d > 0 ? 1 : 0);
    else this._hitsTmp = Math.min(this._hitsMax, Math.max(0, this._hitsTmp + d));
    document.getElementById('hits-val').textContent = this._hitsTmp;
    document.getElementById('hits-de').textContent = this._hitsTmp + ' de ' + this._hitsMax + ' questões';
    document.getElementById('hits-salvar').disabled = false;
  },

  moverDia(key, dia) {
    const n = parseInt(key.slice(1));
    this.congelarSemana(n);
    const o = this.ov[key] || (this.ov[key] = {});
    o.dia = parseInt(dia);
    this.salvar(); this.render({ foco: 'reag:' + key });
    this.anunciar('Atividade reagendada para ' + DIAS_LONGOS[o.dia] + '.');
  },

  /* ---------- mini-simulado: registrar, ver, editar, excluir ---------- */
  _miniTmp: {},
  modalMini(n) {
    const sem = SEMANAS.find(s => s.n === n);
    const lista = sem.temas.concat([sem.geo.id]);
    const existente = this.minis[n];
    this._miniTmp = {};
    lista.forEach(id => { this._miniTmp[id] = existente ? (existente.porTema[id] != null ? existente.porTema[id] : null) : null; });
    const self = this;
    this.abrirModal(
      '<div class="overlay" onclick="if(event.target===this)app.fecharModal()">' +
      '<div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-titulo">' + this._xFechar() +
      '<h3 id="modal-titulo">' + (existente ? 'Resultado do mini · Semana ' + n : 'Mini-simulado da Semana ' + n) + '</h3>' +
      '<p class="sub">' + CONFIG.MINI_QTDE + ' questões, ' + CONFIG.MINI_POR_TEMA + ' por tema. ' + (existente ? 'Ajuste o que precisar — o diagnóstico e a evolução recalculam na hora.' : 'Registre seus acertos por tema (0 a ' + CONFIG.MINI_POR_TEMA + ').') + '</p>' +
      lista.map(id =>
        '<div class="tema-linha"><span class="nome">' + esc(T(id).nome) + '</span>' +
        '<div class="seg" role="group" aria-label="Acertos em ' + esc(T(id).nome) + '">' +
        [0,1,2,3].map(v => {
          const on = self._miniTmp[id] === v;
          return '<button type="button" class="' + (on?'sf':'sn') + '" aria-pressed="' + on + '" data-mini="' + id + '" data-v="' + v + '" onclick="app._miniSet(this)">' + v + '</button>';
        }).join('') + '</div></div>'
      ).join('') +
      '<p class="q-erro" id="mini-erro" aria-live="polite"></p>' +
      '<div class="q-nav">' +
        (existente ? '<button type="button" class="btn btn-danger btn-sm" onclick="app.excluirMini(' + n + ')">Excluir lançamento</button>' : '') +
        '<span class="esp"></span>' +
        '<button type="button" class="btn btn-ghost btn-sm" onclick="app.fecharModal()">Cancelar</button>' +
        '<button type="button" class="btn btn-pri btn-sm" onclick="app.salvarMini(' + n + ')">' + (existente ? 'Salvar alterações' : 'Salvar resultado') + '</button>' +
      '</div></div></div>'
    );
  },
  _miniSet(btn) {
    const id = btn.getAttribute('data-mini'), v = parseInt(btn.getAttribute('data-v'));
    this._miniTmp[id] = v;
    document.querySelectorAll('[data-mini="' + id + '"]').forEach(b => {
      const on = parseInt(b.getAttribute('data-v')) === v;
      b.setAttribute('aria-pressed', on ? 'true' : 'false');
      b.className = on ? 'sf' : 'sn';
    });
  },
  salvarMini(n) {
    const faltam = Object.keys(this._miniTmp).filter(id => this._miniTmp[id] == null);
    if (faltam.length) {
      document.getElementById('mini-erro').textContent = 'Preencha os acertos de: ' + faltam.map(id => T(id).nome).join(', ') + '.';
      return;
    }
    this.congelarSemana(n);
    let total = 0; Object.keys(this._miniTmp).forEach(id => { total += this._miniTmp[id]; });
    this.minis[n] = { porTema: Object.assign({}, this._miniTmp), total, em: new Date().toISOString() };
    this.salvar();
    this.fecharModal();
    this.render({ foco: 'mini:' + n });
    const dose = this.dosePara(SEMANAS[n-1]);
    const tudoFeito = dose.itens.every(it => this.feito(it.key));
    if (tudoFeito) this.celebrarSemana(n);
    else this.toast('ok', 'Mini-simulado registrado', total + '/' + CONFIG.MINI_QTDE + ' acertos. Diagnóstico atualizado na seção Evolução.');
  },

  proximaAtividade(n) {
    const sem = SEMANAS.find(s => s.n === n);
    if (!sem || !this.perfil) return null;
    const dose = this.dosePara(sem);
    const idxHoje = Math.floor((this.hoje() - dt(sem.ini)) / 86400000);
    const pend = dose.itens.filter(it => !this.feito(it.key));
    if (!pend.length) return null;
    const self = this;
    const doDia = pend.filter(it => self.diaDe(it) <= idxHoje).sort((a,b)=>self.diaDe(a)-self.diaDe(b) || b.peso-a.peso);
    if (doDia.length) return doDia[0];
    return pend.slice().sort((a,b)=>self.diaDe(a)-self.diaDe(b) || b.peso-a.peso)[0];
  },

  /* ============================================================
     RENDER — troca de tela leva ao topo; ação local preserva
     rolagem e devolve o foco ao controle acionado
     ============================================================ */
  _tela: null, _uiTab: 'evo', _evoSel: null, _obs: null,
  render(opts) {
    opts = opts || {};
    const brand = document.getElementById('brand-txt');
    if (brand) brand.innerHTML = esc(CONFIG.PRODUTO) + ' <small>' + esc(CONFIG.EDICAO) + '</small>';
    this.renderContagem();
    const root = document.getElementById('root');
    const y = (typeof window !== 'undefined' && window.scrollY) || 0;
    let tela = (!this.perfil || this._editando) ? 'quest' : (this.posProva() ? 'pos' : 'plano');
    const mudouTela = tela !== this._tela; this._tela = tela;
    root.innerHTML = tela === 'quest' ? this.htmlQuest() : tela === 'pos' ? this.htmlPosProva() : this.htmlPlano();
    this._posRender();
    if (mudouTela || opts.modo === 'tela') window.scrollTo(0, 0);
    else if (opts.scrollPara) {
      const el = document.getElementById(opts.scrollPara);
      if (el && el.scrollIntoView) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    } else window.scrollTo(0, y);
    if (opts.foco && document.querySelector) {
      const el = document.querySelector('[data-foco="' + opts.foco + '"]');
      if (el && el.focus) {
        const det = el.closest ? el.closest('details') : null;   // item concluído vai para 'Concluídas' (recolhido)
        if (det && !det.open) det.open = true;
        try { el.focus({ preventScroll: true }); } catch (e) { el.focus(); }
      }
    }
    if (opts.flash && document.querySelector) {
      const card = document.querySelector('[data-atv="' + opts.flash + '"]');
      if (card && card.classList) card.classList.add('flash');
    }
  },
  renderComCarregamento(msg, ms) {
    const root = document.getElementById('root');
    root.innerHTML = '<div class="q-wrap" role="status" aria-live="polite"><p class="sub my-c">' + esc(msg) + '</p>' +
      '<div class="skel skel-a"></div><div class="skel skel-b"></div>' +
      '<div class="skel skel-c"></div><div class="skel skel-d"></div></div>';
    const self = this;
    setTimeout(function () { self._tela = null; self.render({ modo: 'tela' }); }, ms || 400);
  },
  _posRender() {
    if (typeof IntersectionObserver === 'undefined' || !document.querySelectorAll) return;
    if (this._obs) this._obs.disconnect();
    const self = this;
    const secs = ['sec-next', 'sec-agenda', 'sec-mais'].map(id => document.getElementById(id)).filter(Boolean);
    if (!secs.length) { this._navAtiva(null); return; }
    this._obs = new IntersectionObserver(function (entries) {
      let melhor = null;
      entries.forEach(e => { if (e.isIntersecting && (!melhor || e.intersectionRatio > melhor.intersectionRatio)) melhor = e; });
      if (melhor) self._navAtiva(melhor.target.id);
    }, { rootMargin: '-35% 0px -55% 0px', threshold: [0, .2, .5, 1] });
    secs.forEach(s => this._obs.observe(s));
    this._navAtiva(secs[0].id);
  },
  _navAtiva(id, tab) {
    if (!document.querySelectorAll) return;
    const t = tab || this._uiTab;
    document.querySelectorAll('.bnav button, .dnav button').forEach(b => {
      const on = !!id && b.getAttribute('data-alvo') === id && (!b.getAttribute('data-tab') || b.getAttribute('data-tab') === t);
      b.classList.toggle('on', on);
    });
  },
  navTo(alvo, tab) {
    if (tab) this.setTab(tab);
    const el = document.getElementById(alvo);
    if (el && el.scrollIntoView) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    this._navAtiva(alvo, tab);
  },
  setTab(tab) {
    this._uiTab = tab;
    if (!document.querySelectorAll) return;
    document.querySelectorAll('[data-tabbtn]').forEach(b => {
      const on = b.getAttribute('data-tabbtn') === tab;
      b.setAttribute('aria-selected', on ? 'true' : 'false'); b.tabIndex = on ? 0 : -1;
    });
    document.querySelectorAll('[data-tabpanel]').forEach(p => { p.hidden = p.getAttribute('data-tabpanel') !== tab; });
  },
  anunciar(msg) { const el = document.getElementById('sr-status'); if (el) el.textContent = msg; },
  renderContagem() {
    const el = document.getElementById('pill-contagem');
    if (!el) return;
    const dias = Math.ceil((dt(CONFIG.PROVA2) - this.hoje()) / 86400000);
    if (dias > 0) {
      el.innerHTML = ic('flag', 13) + ' Faltam <b>' + dias + '</b> ' + (dias === 1 ? 'dia' : 'dias') + ' para Matemática';
      el.setAttribute('aria-label', 'Faltam ' + dias + ' dias para a prova de Matemática, em ' + fmtCurto(dt(CONFIG.PROVA2)));
    } else if (dias === 0) { el.innerHTML = ic('flag', 13) + ' <b>Hoje</b> é dia de prova'; el.setAttribute('aria-label', 'Hoje é dia de prova'); }
    else { el.innerHTML = ic('check', 13) + ' Prova concluída'; el.setAttribute('aria-label', 'Prova concluída'); }
  },

  /* ---------- confirmação própria (substitui confirm nativo) ---------- */
  _confirmCb: null,
  confirmar(o, cb) {
    this._confirmCb = cb;
    this.abrirModal(
      '<div class="overlay" onclick="if(event.target===this)app.fecharModal()">' +
      '<div class="modal" role="alertdialog" aria-modal="true" aria-labelledby="modal-titulo" aria-describedby="modal-desc">' + this._xFechar() +
      '<h3 id="modal-titulo">' + esc(o.titulo) + '</h3>' +
      '<p class="sub" id="modal-desc">' + o.texto + '</p>' +
      '<div class="q-nav"><span class="esp"></span>' +
      '<button type="button" class="btn btn-ghost btn-sm" onclick="app.fecharModal()">' + esc(o.cancelar || 'Cancelar') + '</button>' +
      '<button type="button" class="btn ' + (o.perigo ? 'btn-danger' : 'btn-pri') + ' btn-sm" onclick="app._confirmarOk()">' + esc(o.ok || 'Confirmar') + '</button>' +
      '</div></div></div>');
  },
  _confirmarOk() { const cb = this._confirmCb; this._confirmCb = null; this.fecharModal(); if (cb) cb(); },
  resetar(confirmado) {
    const self = this;
    if (!confirmado) return this.confirmar({ titulo: 'Zerar todos os dados?', perigo: true, ok: 'Zerar tudo',
      texto: 'Perfil, atividades concluídas, mini-simulados e planos congelados serão apagados deste navegador. Não dá para desfazer.' }, () => self.resetar(true));
    this.perfil = null; this.ov = {}; this.minis = {}; this.planos = {};
    this.semanaSel = null; this.qStep = 0; this._qTemp = null; this._editando = false; this._evoSel = null;
    try { localStorage.removeItem(KEY); } catch (e) { this.toast('erro', 'Não consegui limpar o armazenamento', 'Verifique as permissões do navegador.'); }
    this.render({ modo: 'tela' });
    this.toast('', 'Dados zerados', 'Comece pelo questionário para montar um novo roteiro.');
  },
  recalcularSemana(n, confirmado) {
    if (!this.planos[n]) return;
    const self = this;
    if (!confirmado) return this.confirmar({ titulo: 'Recalcular a Semana ' + n + '?', ok: 'Recalcular',
      texto: 'As cargas das atividades <b>pendentes</b> serão refeitas com o seu perfil e desempenho atuais. O que você já concluiu continua registrado, mas os números de questões pendentes podem mudar.' }, () => self.recalcularSemana(n, true));
    delete this.planos[n];
    this.congelarSemana(n);
    this.salvar();
    this.render({ scrollPara: 'sec-agenda' });
    this.toast('ok', 'Semana ' + n + ' recalculada', 'Cargas atualizadas com o seu perfil e desempenho de agora.');
  },
  excluirMini(n, confirmado) {
    const self = this;
    if (!confirmado) return this.confirmar({ titulo: 'Excluir o mini da Semana ' + n + '?', perigo: true, ok: 'Excluir',
      texto: 'O lançamento sai do histórico e o diagnóstico e o gráfico de evolução são recalculados. Você pode registrar de novo depois.' }, () => self.excluirMini(n, true));
    delete this.minis[n];
    if (this._evoSel === n) this._evoSel = null;
    this.salvar();
    this.render({ foco: 'mini:' + n });
    this.toast('', 'Lançamento excluído', 'Você pode registrar o mini da Semana ' + n + ' novamente quando quiser.');
  },
  celebrarSemana(n) {
    const root = document.getElementById('celebra-root');
    const restam = 7 - n;
    const msg = restam > 0 ? 'Faltam ' + restam + (restam === 1 ? ' semana' : ' semanas') + '. Constância vence talento.' : 'Revisão completa. Agora é prova.';
    if (root) {
      root.innerHTML = '<div class="celebra" role="status" aria-live="assertive"><div class="box">' +
        '<div class="anel">' + ic('trophy', 44) + '</div>' +
        '<div class="h2">Semana ' + n + ' concluída</div><p class="sub mt-8">' + esc(msg) + '</p></div></div>';
      setTimeout(() => { root.innerHTML = ''; }, 2300);
    }
    this.toast('marco', 'Semana ' + n + ' concluída', msg);
  },

  /* ============================================================
     QUESTIONÁRIO — 8 etapas, progresso claro, atalhos por área
     ============================================================ */
  qPassos() { return ['Seu nível', 'Seu tempo', 'Números', 'Álgebra', 'Geometria', 'Dados', 'Sua meta', 'Resumo']; },
  htmlQuest() {
    if (!this._qTemp) {
      this._qTemp = this.perfil ? JSON.parse(JSON.stringify(this.perfil))
                                : { acertos: null, dif: {}, horasDia: null, dias: [], meta: null };
    }
    const passos = this.qPassos(), st = this.qStep;
    const pct = Math.round(st / (passos.length - 1) * 100);
    const faltam = passos.length - 1 - st;
    let corpo = '';
    if (st === 0) corpo = this.qNivel();
    else if (st === 1) corpo = this.qTempo();
    else if (st >= 2 && st <= 5) corpo = this.qArea(AREAS[st - 2]);
    else if (st === 6) corpo = this.qMeta();
    else corpo = this.qResumo();
    return '<div class="q-wrap">' +
      '<span class="eyebrow">' + esc(CONFIG.PRODUTO) + ' · ' + esc(CONFIG.EDICAO) + '</span>' +
      '<div class="h1 mt-6">' + (this.perfil ? 'Reajustar meu perfil' : 'Vamos montar o seu roteiro') + '</div>' +
      '<p class="sub mt-6">Sete semanas, um plano só seu. Leva uns 3 minutos e você pode reajustar quando quiser.</p>' +
      '<div class="q-progress" role="progressbar" aria-valuenow="' + pct + '" aria-valuemin="0" aria-valuemax="100" aria-label="Progresso do questionário">' +
        '<div class="bar"><i style="width:' + pct + '%"></i></div>' +
        '<span class="lbl">' + (faltam === 0 ? 'Última etapa' : 'Etapa ' + (st + 1) + ' de ' + passos.length) + '</span></div>' +
      '<div class="q-card">' + corpo +
        '<p class="q-erro" id="q-erro" aria-live="polite"></p>' +
        '<div class="q-nav">' +
          (st > 0 ? '<button type="button" class="btn btn-ghost" onclick="app.qVoltar()">Voltar</button>'
                  : (this.perfil ? '<button type="button" class="btn btn-ghost" onclick="app._editando=false;app._qTemp=null;app.qStep=0;app.render({modo:\'tela\'})">Cancelar</button>' : '')) +
          '<span class="esp"></span>' +
          (st < passos.length - 1
            ? '<button type="button" class="btn btn-pri" onclick="app.qAvancar()">Continuar</button>'
            : '<button type="button" class="btn btn-pri" onclick="app.qConcluir()">' + (this.perfil ? 'Recalcular meu plano' : 'Criar meu roteiro') + '</button>') +
        '</div></div></div>';
  },
  qNivel() {
    const faixas = ['Menos de 10', '10 a 15', '15 a 20', '20 a 25', '25 a 30', '30 a 35', '35 a 40', 'Acima de 40'];
    const sel = this._qTemp.acertos;
    return '<h2>Nos últimos simulados, quantas das 45 questões de Matemática você acertou?</h2>' +
      '<p class="q-hint">Média dos 2 ou 3 últimos. Se nunca contou, estime com sinceridade: isso calibra a sua meta.</p>' +
      '<div class="opt-grid" role="group" aria-label="Faixa de acertos">' +
      faixas.map((f, i) => '<button type="button" class="opt" data-acertos="' + i + '" aria-pressed="' + (sel === i) + '" onclick="app.qSetAcertos(this)">' + f + '</button>').join('') + '</div>';
  },
  qSetAcertos(btn) {
    this._qTemp.acertos = parseInt(btn.getAttribute('data-acertos'));
    document.querySelectorAll('[data-acertos]').forEach(b => b.setAttribute('aria-pressed', b === btn ? 'true' : 'false'));
    const e = document.getElementById('q-erro'); if (e) e.textContent = '';
  },
  qTempo() {
    const q = this._qTemp;
    const horas = [[0.5, '30 minutos'], [1, '1 hora'], [1.5, '1h30'], [2, '2 horas'], [3, '3 horas'], [4, '4 horas ou mais']];
    return '<h2>Quanto tempo você consegue dedicar ao estudo da Matemática?</h2>' +
      '<p class="q-hint">Conte só o que você cumpre de verdade. O plano é montado dentro desse tempo: melhor um plano curto e cumprido do que um longo e abandonado.</p>' +
      '<div class="campo"><label for="q-horas">Horas por dia</label><select id="q-horas" onchange="app.qHorasMudou()"><option value="">Escolha</option>' +
      horas.map(o => '<option value="' + o[0] + '"' + (q.horasDia == o[0] ? ' selected' : '') + '>' + o[1] + '</option>').join('') + '</select></div>' +
      '<div class="campo"><span class="lbl" id="lbl-dias">Em quais dias da semana você estuda Matemática?</span>' +
      '<div class="seg" role="group" aria-labelledby="lbl-dias">' +
      DIAS_SEMANA.map((nome, i) => '<button type="button" class="sf" data-dia="' + i + '" aria-pressed="' + ((q.dias || []).indexOf(i) !== -1) + '" aria-label="' + DIAS_LONGOS[i] + '" onclick="app.qDia(this)">' + nome + '</button>').join('') +
      '</div><p class="meta" id="q-dias-info" style="margin-top:8px" aria-live="polite">' +
      ((q.dias || []).length ? this._diasResumoTxt(q) : 'Marque todos os dias em que você realmente consegue estudar. O plano distribui as atividades exatamente neles.') + '</p></div>';
  },
  qHorasMudou() { const q = this._qTemp; const el = document.getElementById('q-horas'); q.horasDia = parseFloat(el.value) || null; const info = document.getElementById('q-dias-info'); if (info && (q.dias || []).length) info.textContent = this._diasResumoTxt(q); },
  qDia(btn) {
    const i = parseInt(btn.getAttribute('data-dia')), q = this._qTemp;
    q.dias = q.dias || [];
    const pos = q.dias.indexOf(i);
    if (pos === -1) q.dias.push(i); else q.dias.splice(pos, 1);
    q.dias.sort((a, b) => a - b);
    btn.setAttribute('aria-pressed', pos === -1 ? 'true' : 'false');
    const info = document.getElementById('q-dias-info');
    if (info) info.textContent = q.dias.length ? this._diasResumoTxt(q) : 'Marque ao menos um dia de estudo.';
  },
  _diasResumoTxt(q) {
    const el = document.getElementById('q-horas');
    const h = (el && parseFloat(el.value)) || q.horasDia;
    const base = q.dias.length + (q.dias.length === 1 ? ' dia' : ' dias') + ' por semana';
    return h ? base + ' · ' + (h * q.dias.length).toFixed(1).replace('.', ',') + 'h de estudo semanal' : base;
  },
  qArea(area) {
    const q = this._qTemp, self = this;
    const doGrupo = TEMAS.filter(t => t.area === area.id);
    const avaliados = doGrupo.filter(t => (q.dif[t.id] || 0) !== 0).length;
    return '<div class="area-head"><h2 class="m-0">' + esc(area.nome) + '</h2><span class="contador" id="q-contador" aria-live="polite">' + avaliados + ' de ' + doGrupo.length + ' avaliados</span></div>' +
      '<p class="q-hint">Você <b>não precisa avaliar todos</b>: o que ficar em branco entra com carga padrão e o seu desempenho ajusta depois. ' +
      '<b>Tenho dificuldade</b> = mais tempo e vídeo-aula · <b>Regular</b> = carga padrão · <b>Domino</b> = só manutenção · <b>Não sei</b> = carga padrão por enquanto. ' +
      'Entre dois assuntos de mesma dificuldade, o que <b>cai mais no ENEM</b> recebe mais questões.</p>' +
      '<div class="acoes-rapidas"><button type="button" class="btn btn-sec btn-sm" onclick="app.qAplicarTodos(\'' + area.id + '\', 2)">Restantes = Regular</button>' +
      '<button type="button" class="btn btn-sec btn-sm" onclick="app.qAplicarTodos(\'' + area.id + '\', 9)">Restantes = Não sei</button></div>' +
      '<div class="busca"><span class="ic">' + ic('search', 16) + '</span><input type="search" id="q-busca" placeholder="Buscar assunto em qualquer área" aria-label="Buscar assunto em qualquer área" oninput="app.qBusca(this.value)"></div>' +
      '<div id="q-lista-temas">' + doGrupo.map(t => self.qTemaLinha(t, q.dif[t.id] || 0, false)).join('') + '</div>';
  },
  qTemaLinha(t, v, outraArea) {
    const ops = [[-1, 'Tenho dificuldade', 'sd'], [2, 'Regular', 'sr'], [1, 'Domino', 'sf'], [9, 'Não sei', 'sn']];
    const areaNome = outraArea ? (AREAS.find(a => a.id === t.area) || {}).nome : null;
    return '<div class="tema' + (outraArea ? ' outra' : '') + '"><span class="nome">' + esc(t.nome) + (areaNome ? '<small>Área: ' + esc(areaNome) + '</small>' : '') + '</span>' +
      '<div class="seg" role="group" aria-label="' + esc(t.nome) + '">' +
      ops.map(o => '<button type="button" class="' + o[2] + '" data-seg="' + t.id + '" data-v="' + o[0] + '" aria-pressed="' + (v === o[0]) + '" onclick="app.qSeg(this)">' + o[1] + '</button>').join('') + '</div></div>';
  },
  qSeg(btn) {
    const id = btn.getAttribute('data-seg'), v = parseInt(btn.getAttribute('data-v'));
    const atual = this._qTemp.dif[id] || 0;
    this._qTemp.dif[id] = (atual === v) ? 0 : v;
    const alvo = this._qTemp.dif[id];
    document.querySelectorAll('[data-seg="' + id + '"]').forEach(b => b.setAttribute('aria-pressed', parseInt(b.getAttribute('data-v')) === alvo ? 'true' : 'false'));
    this._qContador();
  },
  _qContador() {
    const el = document.getElementById('q-contador'); if (!el) return;
    const area = AREAS[this.qStep - 2]; if (!area) return;
    const doGrupo = TEMAS.filter(t => t.area === area.id);
    el.textContent = doGrupo.filter(t => (this._qTemp.dif[t.id] || 0) !== 0).length + ' de ' + doGrupo.length + ' avaliados';
  },
  qAplicarTodos(areaId, valor) {
    const q = this._qTemp;
    TEMAS.filter(t => t.area === areaId && !(q.dif[t.id] || 0)).forEach(t => { q.dif[t.id] = valor; });
    const busca = document.getElementById('q-busca'); if (busca) busca.value = '';
    this.qBusca('');
    this._qContador();
    this.anunciar('Assuntos restantes marcados como ' + (valor === 2 ? 'Regular' : 'Não sei') + '.');
  },
  qBusca(txt) {
    const norm = s => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
    const q = norm((txt || '').trim()), self = this;
    const box = document.getElementById('q-lista-temas'); if (!box) return;
    const area = AREAS[this.qStep - 2];
    if (!q) { box.innerHTML = TEMAS.filter(t => t.area === area.id).map(t => self.qTemaLinha(t, self._qTemp.dif[t.id] || 0, false)).join(''); return; }
    const m = TEMAS.filter(t => norm(t.nome).indexOf(q) !== -1);
    box.innerHTML = m.length
      ? '<p class="meta mb-8">Resultados em todas as áreas. Os de outra área aparecem destacados.</p>' + m.map(t => self.qTemaLinha(t, self._qTemp.dif[t.id] || 0, t.area !== area.id)).join('')
      : '<div class="vazio">Nenhum assunto encontrado para <b>' + esc(txt) + '</b>.</div>';
  },
  qMeta() {
    const q = this._qTemp;
    return '<h2>Qual a sua meta de acertos?</h2>' +
      '<p class="q-hint">Das 45 questões de Matemática. Cada mini-simulado será comparado com esse alvo.</p>' +
      '<div class="campo"><label for="q-meta">Meta de acertos (1 a 45)</label><input type="number" id="q-meta" inputmode="numeric" min="1" max="45" value="' + (q.meta == null ? '' : q.meta) + '" oninput="app.qAvaliaMeta()"></div>' +
      '<p class="q-erro" id="q-meta-aviso" aria-live="polite" style="color:var(--text-2)"></p>';
  },
  qAvaliaMeta() {
    const el = document.getElementById('q-meta-aviso'), q = this._qTemp;
    const meta = parseInt(document.getElementById('q-meta').value);
    if (!el) return;
    if (!meta || q.acertos == null) { el.textContent = ''; return; }
    const atual = [7, 12.5, 17.5, 22.5, 27.5, 32.5, 37.5, 42][q.acertos], g = meta - atual;
    if (g <= 0) el.innerHTML = '<span class="c-green">Você já está nesse nível. Considere mirar um pouco mais alto.</span>';
    else if (g <= 7) el.innerHTML = '<span class="c-green">Meta realista: +' + Math.round(g) + ' acertos em 7 semanas dirigidas é factível.</span>';
    else if (g <= 12) el.innerHTML = '<span class="c-amber">Meta ambiciosa (+' + Math.round(g) + '). Possível, mas exige cumprir o plano à risca.</span>';
    else el.innerHTML = '<span class="c-red">+' + Math.round(g) + ' acertos em 7 semanas é improvável. Sugestão: mire ' + Math.round(atual + 10) + ' e reajuste se evoluir rápido.</span>';
  },
  qResumo() {
    const q = this._qTemp, cont = { d: 0, r: 0, f: 0, n: 0 };
    TEMAS.forEach(t => { const v = q.dif[t.id] || 0; if (v === -1) cont.d++; else if (v === 2) cont.r++; else if (v === 1) cont.f++; else if (v === 9) cont.n++; });
    const semAval = TEMAS.length - cont.d - cont.r - cont.f - cont.n;
    const faixas = ['menos de 10', '10–15', '15–20', '20–25', '25–30', '30–35', '35–40', 'acima de 40'];
    const temPlanos = Object.keys(this.planos).length > 0;
    return '<h2>Confira antes de criar o roteiro</h2>' +
      '<div class="resumo-grid">' +
      '<div class="stat"><div class="v">' + faixas[q.acertos] + '</div><div class="l">ACERTOS HOJE</div></div>' +
      '<div class="stat"><div class="v">' + q.meta + '/45</div><div class="l">META</div></div>' +
      '<div class="stat"><div class="v">' + (q.horasDia * q.dias.length).toFixed(1).replace('.', ',') + 'h</div><div class="l">POR SEMANA</div></div>' +
      '<div class="stat"><div class="v v-dias">' + q.dias.map(i => DIAS_SEMANA[i]).join(' · ') + '</div><div class="l">DIAS DE ESTUDO</div></div></div>' +
      '<div class="resumo-grid">' +
      '<div class="stat neg"><div class="v">' + cont.d + '</div><div class="l">COM DIFICULDADE</div></div>' +
      '<div class="stat warn"><div class="v">' + cont.r + '</div><div class="l">REGULARES</div></div>' +
      '<div class="stat pos"><div class="v">' + cont.f + '</div><div class="l">DOMINADOS</div></div>' +
      '<div class="stat"><div class="v">' + (cont.n + semAval) + '</div><div class="l">SEM AVALIAÇÃO</div></div></div>' +
      '<p class="q-hint"><b>Como o plano lê isso:</b> assuntos com dificuldade recebem vídeo-aula e mais questões; dominados ficam só em manutenção. ' +
      '<b>Regular</b>, <b>Não sei</b> e <b>sem avaliação</b> valem o mesmo para o cálculo (carga padrão). A diferença é de registro: "Regular" é a sua avaliação consciente; os outros são lacunas que o seu desempenho vai preencher, para cima ou para baixo, conforme você registra resultados.' +
      (temPlanos ? ' <b>Semanas já iniciadas mantêm o plano congelado</b>: para aplicar o novo perfil nelas, use Recalcular na agenda da semana.' : '') + '</p>';
  },
  qColeta() {
    if (this.qStep === 1) { const h = document.getElementById('q-horas'); if (h) this._qTemp.horasDia = parseFloat(h.value) || null; }
    if (this.qStep === 6) { const m = document.getElementById('q-meta'); if (m) this._qTemp.meta = parseInt(m.value) || null; }
  },
  qValida() {
    const st = this.qStep, q = this._qTemp;
    if (st === 0 && q.acertos == null) return 'Escolha uma faixa de acertos para continuar.';
    if (st === 1 && (!q.horasDia || !(q.dias && q.dias.length))) return 'Informe as horas por dia e marque ao menos um dia de estudo.';
    if (st === 6 && (!q.meta || q.meta < 1 || q.meta > 45)) return 'Defina uma meta entre 1 e 45.';
    return null;
  },
  qAvancar() {
    this.qColeta();
    const erro = this.qValida();
    if (erro) { document.getElementById('q-erro').textContent = erro; this.anunciar(erro); return; }
    this.qStep++; this.render({ modo: 'tela' });
  },
  qVoltar() { this.qColeta(); this.qStep--; this.render({ modo: 'tela' }); },
  qConcluir() {
    this.qColeta();
    const erro = this.qValida();
    if (erro) { document.getElementById('q-erro').textContent = erro; this.anunciar(erro); return; }
    this.perfil = this._qTemp;
    this._qTemp = null; this.qStep = 0; this._editando = false;
    this.salvar(); this.render({ modo: 'tela' });
    this.toast('ok', 'Roteiro pronto', 'Semanas futuras calculadas. Semanas já iniciadas mantêm o plano congelado.');
  },

  /* ============================================================
     PLANO — próximo passo · resumo · agenda (coluna principal)
     + painel lateral no desktop
     ============================================================ */
  primeiroNome() { return String(CONFIG.ALUNO || '').split(' ')[0]; },
  _hm(min) { min = Math.max(0, Math.round(min)); return Math.floor(min / 60) + 'h' + String(min % 60).padStart(2, '0'); },
  _fimSemana(sem) { return addDias(dt(sem.ini), (sem.dias || 7) - 1); },
  _semanaPassada(sem) { return this.hoje() > this._fimSemana(sem); },
  _numerosSemana(sem, dose) {
    const self = this;
    const feitas = dose.itens.filter(it => self.feito(it.key));
    const feitoMin = feitas.reduce((s, it) => s + it.min, 0) + (dose.temMini && this.minis[sem.n] ? CONFIG.MIN_MINI : 0);
    const totalAtv = dose.itens.length + (dose.temMini ? 1 : 0);
    const feitasAtv = feitas.length + (dose.temMini && this.minis[sem.n] ? 1 : 0);
    return { feitoMin, totalMin: dose.totalMin, pct: dose.totalMin ? Math.round(feitoMin / dose.totalMin * 100) : 0,
             totalAtv, feitasAtv, restantes: totalAtv - feitasAtv, miniFeito: !!this.minis[sem.n] };
  },
  htmlPlano() {
    const atualN = this.semanaAtualN();

    return '<svg width="0" height="0" aria-hidden="true" class="svg-defs"><defs><linearGradient id="gradp"><stop offset="0%" stop-color="#22d3ee"/><stop offset="100%" stop-color="#3b82f6"/></linearGradient></defs></svg>' +
      this.htmlSaudacao(atualN, antes, sem) +
      '<div class="layout"><div class="col-main stack-v">' +
        (antes ? this.htmlPre() : '') +
        '<section id="sec-next" aria-label="Seu próximo passo">' + this.htmlNext(sem, dose, atualN, antes) + '</section>' +
        '<section class="only-mobile" aria-label="Resumo da semana"><div class="card">' + resumo + '</div></section>' +
        '<section id="sec-agenda" aria-label="Agenda da semana">' + this.htmlAgenda(sem, dose, atualN) + '</section>' +
        '<section id="sec-mais" aria-label="Evolução, semanas e perfil">' + this.htmlMais(atualN, selN) + '</section>' +
        '<footer>Mockup · Radix Matemática · dados salvos apenas neste navegador</footer>' +
      '</div><aside class="col-side" aria-label="Painel da semana"><div class="stack">' +
        '<div class="card">' + resumo + '</div>' +
        '<div class="card">' + this.htmlTimelineMini(atualN, selN) + '</div>' +
        '<div class="card">' + this.htmlPerfilCompacto() + '</div>' +
      '</div></aside></div>';
  },
  htmlSaudacao(atualN, antes, sem) {
    const ctx = antes ? 'Seu roteiro está pronto. A Semana 1 abre em ' + fmtCurto(dt(SEMANAS[0].ini)) + '.'
      : (atualN && sem.n === atualN) ? 'Semana ' + atualN + ' de 7 · ' + rotSemana(sem)
      : 'Você está vendo a Semana ' + sem.n + ' · ' + rotSemana(sem) + (atualN ? ' · <button type="button" class="btn btn-ghost btn-sm btn-inline" onclick="app.semanaSel=null;app.render({scrollPara:\'sec-next\'})">voltar à semana atual</button>' : '');

  },
  htmlPre() {
    return '<div class="aviso"><b>A revisão começa em ' + fmtCurto(dt(CONFIG.INICIO)) + '.</b> Até lá, siga o cronograma normal do curso. Quando a Semana 1 abrir, o seu primeiro passo aparece aqui automaticamente.</div>';
  },
  htmlNext(sem, dose, atualN, antes) {
    if (antes) {
      return '<div class="next quiet"><span class="eyebrow">Enquanto a revisão não começa</span>' +
        '<h2>Seu plano da Semana 1 já está montado</h2>' +
        '<p class="just">Explore a agenda abaixo para ver como as suas respostas viraram carga de estudo. Dá para reajustar o perfil quantas vezes quiser até lá.</p></div>';
    }

    }
    if (!prox) {
      return '<div class="next"><span class="eyebrow">Seu próximo passo</span>' +
        '<h2>Mini-simulado da Semana ' + sem.n + '</h2>' +
        '<div class="infos"><span>' + ic('clock', 15) + ' ~' + CONFIG.MIN_MINI + ' min</span><span>' + ic('book', 15) + ' ' + CONFIG.MINI_QTDE + ' questões · ' + CONFIG.MINI_POR_TEMA + ' por tema</span></div>' +
        '<p class="just">Todas as atividades da semana foram concluídas. O mini fecha o ciclo e mede a sua evolução real.</p>' +
        '<div class="acts"><button type="button" class="btn btn-pri" data-foco="mini:' + sem.n + '" onclick="app.modalMini(' + sem.n + ')">Registrar resultado</button>' +
        '<button type="button" class="btn btn-sec" onclick="app.toast(\'\',\'Demonstração\',\'No app real: inicia o mini-simulado cronometrado na plataforma.\')">Fazer na plataforma</button></div></div>';
    }
    const just = prox.auto
      ? (prox.efv === -1 ? 'Ajustado pelo seu desempenho: seus registros neste assunto ficaram abaixo de 50%, então a carga aumentou.'
                         : 'Ajustado pelo seu desempenho: seus registros mostram evolução, então a carga caiu para manutenção.')
      : prox.efv === -1 ? ('Prioridade alta: você marcou dificuldade neste assunto' + ((prox.inc && prox.inc.v >= 3) ? ', e ele cai em média ' + prox.inc.v.toString().replace('.', ',') + ' questões por prova.' : '.'))
      : prox.geo ? 'Geometria da semana: presença fixa no roteiro, toda semana tem uma.'
      : prox.efv === 1 ? 'Manutenção leve: você domina este assunto, é só não perder o ritmo.'
      : (prox.inc && prox.inc.rotulo) ? 'Assunto de peso: cai em média ' + prox.inc.v.toString().replace('.', ',') + ' questões por prova do ENEM, então recebe mais tempo no seu plano.'
      : 'Carga padrão desta semana.';
    const atrasada = (sem.n === atualN && this.diaDe(prox) < Math.floor((this.hoje() - dt(sem.ini)) / 86400000)) || passada;
    return '<div class="next"><span class="eyebrow">' + (atrasada ? 'Atividade atrasada · seu próximo passo' : 'Seu próximo passo') + '</span>' +
      '<h2>' + esc(prox.titulo) + '</h2>' +
      '<div class="infos"><span>' + ic('clock', 15) + ' ~' + prox.min + ' min</span>' +
      '<span>' + ic(prox.tipo === 'v' ? 'play' : 'book', 15) + ' ' + (prox.tipo === 'v' ? 'Vídeo-aula' : 'Questões no banco') + '</span>' +
      '<span>' + ic('cal', 15) + ' ' + DIAS_LONGOS[this.diaDe(prox)] + ' ' + fmtCurto(addDias(dt(sem.ini), this.diaDe(prox))) + '</span></div>' +
      '<p class="just">' + just + '</p>' +
      '<div class="acts"><button type="button" class="btn btn-pri" onclick="app.demoAbrir(\'' + prox.temaId + '\')">Abrir atividade</button>' +
      '<button type="button" class="btn btn-sec" data-foco="next:' + prox.key + '" onclick="app.concluir(\'' + prox.key + '\')">Marcar concluída</button></div></div>';
  },
  htmlProgresso(sem, dose) {
    const n = this._numerosSemana(sem, dose);
    const r = 36, c = Math.round(2 * Math.PI * r * 100) / 100;
    const sobra = dose.budget - dose.totalMin;
    return '<div class="resumo">' +
      '<div class="ring" role="img" aria-label="Progresso da Semana ' + sem.n + ': ' + n.pct + ' por cento">' +
        '<svg width="84" height="84" aria-hidden="true"><circle cx="42" cy="42" r="' + r + '" fill="none" stroke="#1a2a55" stroke-width="8"/>' +
        '<circle cx="42" cy="42" r="' + r + '" fill="none" stroke="url(#gradp)" stroke-width="8" stroke-linecap="round" stroke-dasharray="' + c + '" stroke-dashoffset="' + (c * (1 - n.pct / 100)) + '"/></svg>' +
        '<span class="pct">' + n.pct + '%</span></div>' +
      '<div><div class="h3 mb-6">Semana ' + sem.n + '</div><div class="kpis">' +
        '<div class="kpi"><div class="v">' + n.feitasAtv + '<span class="meta"> / ' + n.totalAtv + '</span></div><div class="l">concluídas</div></div>' +
        '<div class="kpi"><div class="v">' + n.restantes + '</div><div class="l">restantes</div></div>' +
        '<div class="kpi"><div class="v">' + this._hm(n.feitoMin) + '</div><div class="l">tempo feito</div></div>' +
        '<div class="kpi"><div class="v">' + this._hm(n.totalMin) + '</div><div class="l">planejado</div></div>' +
      '</div></div>' +
      '<div class="resumo-foot"><span>Plano montado dentro das <b>' + this._hm(dose.budget) + '</b> que você marcou no perfil' + (sobra >= CONFIG.MIN_QUESTAO ? ' (' + sobra + ' min livres)' : '') + '.</span>' +
        (dose.temMini ? '<span class="chip ' + (n.miniFeito ? 'chip-ok' : 'chip-neutro') + '">' + (n.miniFeito ? 'Mini feito · ' + this.minis[sem.n].total + '/' + CONFIG.MINI_QTDE : 'Mini pendente') + '</span>' : '') +
        (dose.avisos.length ? '<span class="chip chip-atraso tip" data-tip="' + esc(dose.avisos[0]) + '" tabindex="0">' + ic('alert', 12) + ' Tempo curto</span>' : '') +
      '</div></div>';
  },
  _cardAtividade(sem, dose, it, estado) {
    const done = this.feito(it.key), o = this.ov[it.key] || {};
    const priCls = it.geo ? 'chip-geo' : (it.peso >= 3 ? 'chip-alta' : it.peso >= 2 ? 'chip-padrao' : 'chip-leve');
    const priTxt = it.geo ? 'Geometria' : (it.peso >= 3 ? 'Prioridade alta' : it.peso >= 2 ? 'Carga padrão' : 'Manutenção');
    const nomeTema = it.titulo.split('— ')[1] || it.titulo;
    const tipo = it.tipo === 'v' ? 'Vídeo-aula · ' + it.min + ' min' : it.questoes + ' questões · ~' + it.min + ' min';
    const dia = this.diaDe(it);
    const extras = [];
    if (it.inc && it.inc.rotulo) extras.push('<span class="tip" data-tip="Cai em média ' + it.inc.v.toString().replace('.', ',') + ' questões por prova do ENEM, por isso recebe mais tempo." tabindex="0">' + it.inc.rotulo.toLowerCase().replace('incidência', 'no ENEM') + '</span>');
    if (it.auto) extras.push('<span class="tip" data-tip="' + (it.efv === -1 ? 'Seus registros neste assunto ficaram abaixo de 50%: a carga aumentou automaticamente.' : 'Seus registros neste assunto passaram de 80%: a carga caiu para manutenção.') + '" tabindex="0">ajustado pelo seu desempenho</span>');
    const nDias = sem.dias || 7;
    const marcados = (dose.diasAtivos && dose.diasAtivos.length ? dose.diasAtivos : [0, 1, 2, 3, 4]).filter(d => d < nDias);

      lista.map(d => '<option value="' + d + '"' + (d === dia ? ' selected' : '') + '>' + DIAS_LONGOS[d] + ' ' + fmtCurto(addDias(dt(sem.ini), d)) + '</option>').join('') + '</select></label>';
    return '<article class="atv' + (done ? ' done' : '') + (estado === 'late' ? ' late' : '') + '" data-atv="' + it.key + '">' +
      '<button type="button" class="chk" role="checkbox" aria-checked="' + done + '" data-foco="chk:' + it.key + '" aria-label="' + (done ? 'Desfazer conclusão de ' : 'Concluir ') + esc(it.titulo) + '" onclick="app.concluir(\'' + it.key + '\')">' + ic('check', 20) + '</button>' +
      '<div class="atv-body"><div class="atv-top"><span>' + tipo + '</span><span class="chip ' + priCls + '">' + priTxt + '</span></div>' +
      '<h4 class="atv-titulo">' + esc(nomeTema) + '</h4>' +
      '<div class="atv-meta"><span>' + DIAS_LONGOS[dia] + ' ' + fmtCurto(addDias(dt(sem.ini), dia)) + '</span>' +
